<svg class="rhythm" viewBox="0 0 520 220" role="img" aria-label="Comparaison : une ligne droite pointillée représente le rythme attendu au travail, une courbe en vagues représente le rythme réel d'un corps en endométriose">  <line class="ax" x1="30" y1="14" x2="30" y2="190" stroke-width="2"></line>  <line class="ax" x1="30" y1="190" x2="504" y2="190" stroke-width="2"></line>  <line class="lin" x1="30" y1="52" x2="504" y2="52" stroke-width="4" stroke-dasharray="10 9" stroke-linecap="round"></line>  <path class="cyc" d="M30 140C74 50 108 50 150 140S228 178 270 112S348 48 392 140S470 164 504 118" fill="none" stroke-width="5" stroke-linecap="round"></path>  <circle class="dot" cx="504" cy="118" r="9" stroke-width="3"></circle>  <text class="lb" x="40" y="34" font-size="14" font-weight="700">Rythme attendu : constant, linéaire</text>  <text class="lb" x="40" y="212" font-size="14" font-weight="700">Rythme vécu : des cycles, de la douleur et de la fatigue</text></svg>