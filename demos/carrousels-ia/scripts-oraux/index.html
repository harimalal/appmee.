<main>
<h1>Scripts oraux des carrousels</h1>
<p class="lead">Six carrousels Reflex IA, six textes à dire à voix haute, comme à un pote. Les repères en vert indiquent la slide : ils ne se lisent pas.</p>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="view"></div>
<p class="note">Les chiffres viennent des articles Reflex IA. Les prix et plafonds sont à revérifier avant tournage.</p>
</main>
<script>
const D=[{"id": "1", "titre": "Vos shorts par l'IA", "n": 8, "sub": "Opus Clip, Quso, Munch. À dire comme à un pote. Les repères [entre crochets] ne se lisent pas.", "secs": [{"t": "1 · Couverture", "p": ["Tu fais des vidéos longues et tu voudrais en tirer des shorts ? Il y a des outils IA qui le font pour toi : Opus Clip, Quso, Munch. Mais je te préviens tout de suite : ils te font gagner des heures… pas ta relecture."]}, {"t": "2 · À la main vs avec l'IA", "p": ["Une vidéo d'une heure découpée en clips à la main, c'est trois à huit heures de montage. Il faut repérer les bons passages, couper, sous-titrer, recadrer pour chaque réseau.", "Avec ces outils, on vise plutôt trente minutes à une heure et demie. Ils te retirent 70 à 80 % du montage. Mais ils ne le suppriment pas, et c'est ça qu'il faut retenir."]}, {"t": "3 · Trois outils, trois usages", "p": ["Les trois ne font pas la même chose. Opus Clip, c'est le point d'entrée : 14,5 $ par mois en annuel. Quso, c'est celui qui planifie aussi tes posts : 15 $ en annuel. Et Munch, c'est pour l'analytics : 49 $ par mois, et pas de version gratuite."]}, {"t": "4 · Le piège des crédits", "p": ["Le piège, c'est de compter des crédits au lieu de compter des clips. Sur Quso, un seul clip fini te coûte entre 10 et 25 crédits, parce que le clip, les sous-titres et le recadrage se paient chacun à part. Résultat : les 75 crédits gratuits, ça fait trois à sept clips. Pas 75."]}, {"t": "5 · Munch", "p": ["Munch, c'est vraiment pour les gros volumes. Il s'appuie sur tes tendances et ton historique. Sauf que sans trois mois d'analytics derrière toi, son avantage est quasi nul. Et comme les deux autres, il est fait pour des vidéos face caméra."]}, {"t": "6 · La méthode", "p": ["La méthode qui tient la route est simple. Une vidéo face caméra : le gaming, le sport ou la musique, ça donne des résultats moyens. Tu laisses l'IA proposer les clips. Tu relis chaque clip, trente secondes, parce qu'une coupe au milieu d'une phrase peut changer le sens. Et tu paies à l'année. Ma pépite : Opus Clip Pro à 14,5 $ par mois, c'est moins cher que le Starter mensuel à 15 $, avec trois fois plus de crédits."]}, {"t": "7 · Quel outil pour qui", "p": ["Tu commences, une vidéo par semaine : Opus Clip. Tu veux aussi planifier tes posts : Quso. Tu es une équipe, avec trois mois d'analytics et du volume : Munch."]}, {"t": "8 · Résumé", "p": ["En résumé : l'IA coupe, toi, tu relis. Opus Clip en annuel pour démarrer, Quso si la planification compte, Munch seulement avec de l'historique. Et trente secondes de relecture par clip, toujours.", "Petite précision : ce sont des sources compilées, prix officiels et avis G2 et Capterra. Je ne les ai pas testés moi-même. Le comparatif complet est sur reflex-ia.com."]}], "mots": 462}, {"id": "2", "titre": "Avatars IA vidéo : lisez le plafond avant le prix", "n": 11, "sub": "HeyGen, Synthesia, Colossyan. À dire comme à un pote. Les repères [entre crochets] ne se lisent pas.", "secs": [{"t": "1 · Couverture", "p": ["Les avatars IA en vidéo, c'est bluffant. Mais avant de regarder le prix, regarde le plafond. HeyGen, Synthesia, Colossyan : je te montre ce que les pages tarifs ne disent pas."]}, {"t": "2 · 4 critères", "p": ["Pour choisir, je regarde quatre choses. Le réalisme : la bouche, les gestes, la voix. Les fonctions entreprise : les langues, les quiz, l'export pour les plateformes de formation. La prise en main : est-ce que tu sors une première vidéo sans développeur ni monteur ? Et le prix transparent : les plafonds de minutes, les crédits, le filigrane."]}, {"t": "3 · Le classement", "p": ["Mon classement sur 20 : HeyGen 16, pour le réalisme. Synthesia 15, pour les grandes entreprises. Colossyan 15, pour la formation. Et Elai.io 14, pour les petits budgets."]}, {"t": "4 · HeyGen", "p": ["HeyGen, c'est le plus réaliste. Mais pas le plus simple à payer : 29 $ par mois en Creator, 49 en Pro, 149 en Business, plus 20 $ par siège. Ses forces : les avatars et la traduction vidéo. À surveiller : des crédits perdus sur des rendus ratés, et des abonnements relancés après une pause."]}, {"t": "5 · Même outil, deux notes", "p": ["Et regarde ça. Même outil, deux notes. Sur G2, HeyGen a 4,8 sur 5. Sur Trustpilot… 2,3. Et ce que racontent les avis Trustpilot, c'est justement ces crédits perdus sur des rendus échoués."]}, {"t": "6 · Synthesia", "p": ["Chez Synthesia, c'est le plafond qui décide de tout. Sur le Starter, tu as 120 minutes… par an. Environ dix par mois. Une seule vidéo de 8 minutes, et tu as déjà consommé 80 % de ton quota."]}, {"t": "7 · D-ID", "p": ["D-ID, c'est le piège du filigrane. Le plan Lite est à 5,90 $ par mois… avec filigrane. Pour l'enlever, il faut monter jusqu'à 108 $ par mois en annuel. Et sur Trustpilot, les avis tournent entre 1,5 et 2,6, avec du renouvellement automatique et des remboursements refusés."]}, {"t": "8 · Red flags", "p": ["Donc quatre red flags de facturation. HeyGen : des crédits perdus. Synthesia : 120 minutes par an. D-ID : le filigrane jusqu'à 108 $. Et Tavus : les tarifs ont été remaniés en juillet 2026, vérifie la grille avant de payer."]}, {"t": "9 · La pépite", "p": ["Ma pépite : Elai.io, à 23 $ par mois. 4,6 sur G2. Tu as 15 minutes de vidéo par mois, et il peut générer une vidéo directement à partir d'un article. Le réalisme est un cran en dessous des trois premiers, mais pour le prix, c'est très honnête."]}, {"t": "10 · Quel avatar pour qui", "p": ["Formation en PME : Colossyan. Grande entreprise : Synthesia. Indépendant ou agence : HeyGen. Budget serré : Elai.io."]}, {"t": "11 · Résumé", "p": ["En résumé : lis la facturation, pas la démo. HeyGen si le réalisme prime, mais surveille ta facture. Synthesia : compte tes minutes avant de signer. Colossyan pour les quiz et la formation. Elai.io si le budget compte.", "Et un rappel : depuis le 2 août 2026, l'AI Act demande de signaler les contenus synthétiques.", "Ce sont des notes G2 et Trustpilot et les tarifs d'octobre 2026. Je n'ai pas testé ces outils moi-même. Le comparatif complet est sur reflex-ia.com."]}], "mots": 522}, {"id": "3", "titre": "Outils GEO : de 29 $ à 2 000 $ par mois", "n": 10, "sub": "Peec AI, Semrush, Ahrefs. À dire comme à un pote. Les repères [entre crochets] ne se lisent pas.", "secs": [{"t": "1 · Couverture", "p": ["Tu veux savoir si ChatGPT ou Perplexity parlent de ta marque ? Il y a des outils pour ça, on appelle ça le GEO. Et les prix vont de 29 $… à plus de 2 000 $ par mois. Pour une promesse qui se ressemble beaucoup."]}, {"t": "2 · Pas de Search Console", "p": ["Le problème de départ : il n'existe aucune Search Console pour les réponses de l'IA. Une réponse change d'une session à l'autre. Donc si tu veux savoir combien de fois tu es cité, il te faut un outil qui pose les questions à ta place et qui compte."]}, {"t": "3 · 4 critères", "p": ["Je regarde quatre critères. La couverture : quels moteurs IA sont suivis, et lesquels sont payés en supplément. L'actionnabilité : est-ce que l'outil mesure seulement, ou est-ce qu'il te dit quoi publier ? Le rapport qualité-prix, add-ons compris. Et la prise en main : un premier tableau de bord fiable, sans formation."]}, {"t": "4 · Le classement", "p": ["Mon classement sur 20 : Peec AI en tête avec 16. Puis Semrush AI Toolkit et Otterly.AI à 15, Ahrefs Brand Radar à 14, Profound 13, Scrunch 12."]}, {"t": "5 · Peec AI", "p": ["Peec AI, il mesure… mais il ne conseille pas. Le Starter est à 70 € par mois pour 50 prompts et trois moteurs, puis 180 en Pro, 360 en Advanced. 4,8 sur G2. C'est le meilleur équilibre entre prix et clarté. Par contre, peu de recommandations, et pas d'outil de contenu."]}, {"t": "6 · La pépite", "p": ["Ma pépite, c'est Otterly.AI, à 29 $ par mois pour 15 prompts. Quand la plupart des concurrents démarrent entre 70 et 250 $. En plus, il fait des audits GEO de tes pages, avec des recommandations. Seul bémol : Gemini, le mode IA de Google et Claude sont en options payantes."]}, {"t": "7 · Semrush, Ahrefs", "p": ["Si tu es déjà chez Semrush ou Ahrefs, l'IA, c'est en supplément. Chez Semrush, l'AI Toolkit coûte environ 99 $ par mois et par domaine, en plus de l'abonnement. Mais c'est le plus actionnable. Chez Ahrefs, Brand Radar démarre à 199 $ par mois, et ça peut monter de 398 à 699 $ selon les plateformes suivies."]}, {"t": "8 · Red flags", "p": ["Quatre red flags avant de payer. Profound Starter à 99 $ ne suit que ChatGPT : le vrai multi-moteurs commence à 399. Ahrefs Brand Radar : dans un test indépendant, il a rapporté 3 mentions ChatGPT… contre 123 réelles. L'AI Toolkit de Semrush, c'est 99 $ de plus par domaine. Et Scrunch démarre à 250 $, avec des analyses sans vraie lecture."]}, {"t": "9 · Quel outil pour qui", "p": ["Budget serré : Otterly.AI ou Peec AI. Déjà abonné Semrush : l'AI Toolkit. Déjà abonné Ahrefs : Brand Radar. Agence multi-clients : Peec AI ou Otterly.AI. Grande marque : Profound ou Scrunch."]}, {"t": "10 · Résumé", "p": ["En résumé : mesure avant d'investir. Teste à 29 $ avec Otterly.AI. Peec AI pour le meilleur équilibre. Semrush ou Ahrefs si tu paies déjà la suite. Et recoupe toujours les chiffres.", "Ce sont des scores éditoriaux, des avis G2 et les prix d'octobre 2026. Je n'ai pas testé ces outils moi-même. Le comparatif complet est sur reflex-ia.com."]}], "mots": 527}, {"id": "4", "titre": "Agent IA autonome : où tourne le vôtre ?", "n": 11, "sub": "OpenClaw, Manus, Dust. À dire comme à un pote. Les repères [entre crochets] ne se lisent pas.", "secs": [{"t": "1 · Couverture", "p": ["Tout le monde veut son agent IA autonome. Tu lui dis « prépare mon point de lundi », et il va chercher dans tes mails, ton tableur, et il te rend un brouillon. Mais avant de choisir lequel, pose-toi une question : il tourne où, ton agent ?"]}, {"t": "2 · Trois familles", "p": ["Il y a trois familles. Les agents auto-hébergés, comme OpenClaw ou Hermes Agent : ils tournent sur ta machine, avec accès à tes fichiers. Les agents cloud, comme Manus ou Perplexity Computer : ils tournent sur les serveurs de l'éditeur. Et les plateformes d'équipe, comme Dust, qui se branchent sur Slack, Notion, Drive."]}, {"t": "3 · 4 critères", "p": ["Pour choisir, je regarde quatre choses. L'autonomie réelle : un chatbot qui répond, ce n'est pas un agent ; un agent ouvre des fichiers, lance des commandes et revient avec un résultat. La prise en main : un compte et une carte bancaire, ou un serveur à installer ? Le contrôle des données, c'est le critère le plus décisif. Et le coût : un prix lisible, avec des plafonds de dépense."]}, {"t": "4 · Le classement", "p": ["Mon classement sur 20 : Perplexity Computer et Dust à 15. Manus et Hermes Agent à 13. OpenClaw à 12. Et Paperclip à 12, ma pépite, j'y reviens."]}, {"t": "5 · Gratuit ne veut pas dire 0 $", "p": ["Attention au mot « gratuit ». Un agent open source peut te coûter de 6 $ à plus de 200 $ par mois, selon le modèle d'IA que tu lui branches. OpenClaw : 4 à 25 $ d'hébergement, 6 à 13 $ d'API en usage léger… et 100 à 500 $ en usage lourd. Hermes Agent : 4 à 25 $ de serveur, et 2 à 60 $ d'API."]}, {"t": "6 · OpenClaw", "p": ["OpenClaw, c'est le plus large… et le plus exposé. Sur sa place de marché de skills, Koi Security en a trouvé 341 malveillantes sur 2 857. Bitdefender parle d'environ 900. Il y a eu une faille qui permettait d'exécuter du code en un clic, corrigée depuis. Et tant que le bac à sable n'est pas configuré, les outils tournent directement sur ta machine. Hermes Agent a eu aussi une faille, sur son scanner de skills."]}, {"t": "7 · Manus", "p": ["Manus : 4,3 sur G2… et 1,2 sur Trustpilot. Une tâche complexe, c'est 500 à 900 crédits, sans estimation avant. Et une tâche ratée consomme quand même tes crédits. Côté positif : 300 crédits gratuits par jour, et un plan Pro dès 20 $ pour 4 000 crédits."]}, {"t": "8 · Cloud et équipe", "p": ["Côté cloud et équipe, ce sont les crédits qui décident. Perplexity Computer : 200 $ par mois, 10 000 crédits, ce qui fait entre 33 et 100 tâches. Et les crédits ne sont pas reportés. Dust : 30 $ par siège, 8 000 crédits. Et le plan gratuit, c'est 500 crédits… une seule fois."]}, {"t": "9 · La pépite", "p": ["Ma pépite : Paperclip, le chef des agents. C'est un orchestrateur open source : tu lui donnes un objectif, il répartit le travail entre OpenClaw, Hermes, Claude Code, Codex ou Gemini, avec une étape de validation et des budgets. Licence MIT, plus de 100 000 étoiles sur GitHub. Ses limites : les connecteurs de chat sont encore expérimentaux, et la télémétrie est activée par défaut."]}, {"t": "10 · Quel agent pour qui", "p": ["Solopreneur pas technique : Manus. Profil technique : OpenClaw ou Hermes Agent. Équipe de 5 à 100 personnes : Dust. Budget zéro et envie de bricoler : Hermes Agent ou OpenClaw. Plusieurs agents à superviser : Paperclip."]}, {"t": "11 · Résumé", "p": ["En résumé : choisis d'abord où il tourne. Auto-hébergé : le bac à sable avant tout. Un forfait Max n'est pas illimité : compte tes tâches. Plafonne ta facture avant de lancer. Et pour débuter sans risque, teste Manus gratuitement.", "Ce sont des étoiles GitHub, des avis G2 et Trustpilot et des tarifs relevés en octobre 2026. Je n'ai pas testé ces outils moi-même. Le comparatif complet est sur reflex-ia.com."]}], "mots": 666}, {"id": "5", "titre": "Agent de code IA : déléguez le code, gardez l'idée", "n": 11, "sub": "Claude Code, Codex, Devin. À dire comme à un pote. Les repères [entre crochets] ne se lisent pas.", "secs": [{"t": "1 · Couverture", "p": ["Moi, je ne suis pas développeur. Et pourtant, aujourd'hui, je fais coder des choses. Les agents de code, comme Claude Code, Codex ou Devin, baissent énormément la barrière. Tu délègues le code, et toi, tu gardes l'idée et la conception."]}, {"t": "2 · Trois logiques", "p": ["Il faut juste comprendre trois logiques. L'automatisation : un déclencheur, des étapes fixes, un résultat, avec des règles écrites d'avance. L'assistant de code : tu écris, il suggère, tu valides ligne par ligne. Et l'agent autonome : tu lui donnes un objectif, il planifie, il lit le code, il modifie, il teste, il se corrige, et il te rend le résultat. Toi, tu relis. On passe de « tu fais » à « tu délègues »."]}, {"t": "3 · 4 critères", "p": ["Pour choisir, je regarde quatre critères. L'autonomie : la part du travail qu'il fait seul, de A à Z. La fiabilité : la proportion de tâches vraiment terminées. Le contrôle et la sécurité : un bac à sable, une relecture avant de fusionner, la possibilité de garder ton code chez toi. Et le prix prévisible, quand l'usage monte."]}, {"t": "4 · Le classement", "p": ["Mon classement sur 20 : Claude Code en tête avec 16. Codex et OpenHands à 15. Google Jules 14, GitHub Copilot 13, et Devin 12."]}, {"t": "5 · La facture dérive", "p": ["Les prix d'entrée se ressemblent : 10 à 25 $ par mois. Mais la facture, elle, dérive selon le modèle. Il y a le forfait fixe. Il y a la fenêtre d'usage avec un plafond, c'est Claude Code. Les crédits au jeton, c'est Codex et Copilot. Et les unités de calcul, c'est Devin. Plus tu utilises, plus l'écart se creuse."]}, {"t": "6 · Claude Code", "p": ["Claude Code, c'est le plus abouti, mais ses limites font débat. Pro dès 20 $, Max à 100 ou 200 $ par mois. Il fonctionne par fenêtres de 5 heures, avec un plafond par semaine. Même sur Max à 200 $, les gros utilisateurs butent. Et selon une source, il consomme 3 à 4 fois plus de jetons que Codex sur la même tâche."]}, {"t": "7 · Devin", "p": ["Devin, c'est l'agent le plus autonome sur le papier. Mais en vrai : 14 à 15 % de tâches complexes réussies en autonomie, d'après des évaluations indépendantes. Il facture à l'ACU, une unité de calcul : 2,25 $ l'ACU, environ 15 minutes de travail. Un correctif typique, c'est 2 à 3 ACU. La facture grimpe vite."]}, {"t": "8 · Codex et Copilot", "p": ["Chez Codex et Copilot, les quotas fixes ont disparu. Depuis le 2 avril 2026 pour Codex, et le 1er juin pour Copilot, c'est des crédits facturés au jeton. Avant, tu connaissais ton coût. Maintenant, il est plus difficile à prévoir. Copilot, c'est 10 $ en Pro, 39 $ en Pro+. Codex est inclus dans ChatGPT Plus à 20 $."]}, {"t": "9 · La pépite", "p": ["Ma pépite : OpenHands, l'agent qui reste chez toi. Tu décris la tâche en français, il travaille dans un bac à sable Docker, sur ta machine ou ton serveur, et tu relis le résultat avant de valider. Ton code et tes clés restent chez toi. Licence MIT, plus de 86 000 étoiles. Et avec un modèle open source, une tâche coûte environ 5 % de ce qu'elle coûterait sur Devin, selon une source."]}, {"t": "10 · Quel agent pour qui", "p": ["Développeur solo : Claude Code ou Codex. Budget serré : Jules, avec 15 tâches gratuites par jour, ou Copilot à 10 $. Garder le contrôle : OpenHands. Déjà sur GitHub : Copilot ou Jules. Une file de tickets répétitifs : Devin ou Codex, en surveillant les ACU. Et si tu débutes : Jules ou OpenHands, pour tester avant de payer."]}, {"t": "11 · Résumé", "p": ["En résumé : cadre la tâche, et plafonne. Délègue des tâches bien cadrées. Relis toujours avant de fusionner. Surveille tes crédits, tes ACU et tes plafonds. Et pour tester, Jules gratuit ou OpenHands.", "Ce sont des prix et des limites relevés en octobre 2026, sans note G2 vérifiable. Je n'ai pas testé ces outils moi-même pour le comparatif. Le comparatif complet est sur reflex-ia.com."]}], "mots": 680}, {"id": "6", "titre": "Pubs générées par IA : le prix ne dit pas le volume", "n": 11, "sub": "AdMakeAI, AdCreative.ai, Predis.ai. À dire comme à un pote. Les repères [entre crochets] ne se lisent pas.", "secs": [{"t": "1 · Couverture", "p": ["Les outils qui génèrent tes pubs avec l'IA affichent presque tous le même prix : autour de 39 $ par mois. Sauf que pour 39 $, tu n'as pas du tout le même nombre de pubs. Je te montre ce que 39 $ achètent vraiment."]}, {"t": "2 · Le problème", "p": ["Le vrai problème : tu as un produit, et des dizaines de variantes à refaire. Plusieurs accroches, et chaque fois un format carré, un format story, une bannière. C'est le travail invisible qui mange la moitié du temps d'un media buyer, ou d'un solopreneur qui fait tout seul."]}, {"t": "3 · Trois logiques", "p": ["Et derrière « pub IA », il y a trois logiques très différentes. La veille : l'outil regarde ce qui marche chez tes concurrents, dans la bibliothèque de pubs de Meta. Le scoring : il devine quelle variante va le mieux performer avant de la diffuser. Et le design avec un vernis IA : en fait un éditeur de templates, où tout le montage reste manuel. Choisis d'abord ta logique. Le prix, ensuite."]}, {"t": "4 · 4 critères", "p": ["Je regarde quatre critères. La génération : est-ce qu'il crée un visuel depuis une source, ta fiche produit, ton site ? Le respect de ta charte : logo, couleurs, polices. Les templates et la veille. Et le prix, mais rapporté au volume de pubs produites, pas au prix d'appel."]}, {"t": "5 · Le classement", "p": ["Mon classement sur 20 : AdMakeAI en tête avec 17. AdCreative.ai 16, Predis.ai 15. Puis Creatopy et Omneky à 13, Canva 12, AdMaker de PicsArt et QuickAds à 11."]}, {"t": "6 · AdMakeAI", "p": ["AdMakeAI, pour 39 $ par mois, te donne 500 crédits. AdCreative.ai, pour le même prix… 10 téléchargements. Tu vois l'écart. Et AdMakeAI fait la veille dans la bibliothèque Meta et la génération dans le même outil. Essai gratuit, 4,3 sur 5, avec peu d'avis pour l'instant."]}, {"t": "7 · Deux façons de gagner", "p": ["Les deux suivants gagnent autrement. AdCreative.ai, c'est le scoring : l'éditeur annonce plus de 90 % de précision. Essai de 7 jours, carte requise, à partir de 29 à 39 $… mais la vraie volumétrie se paie entre 149 et 249 $ par mois. Predis.ai, c'est l'e-commerce : depuis ta fiche produit Shopify, il crée le visuel, la légende et les hashtags, et publie sur jusqu'à 20 canaux. 19 $ par mois pour 1 300 crédits, et 4,7 sur 5."]}, {"t": "8 · La pépite", "p": ["Ma pépite : Omneky. En avril 2026, ils ont divisé leurs prix par deux à trois. Un test créatif dynamique, qui coûtait des milliers de dollars, coûte maintenant entre 50 et 300 $. Tu sors 5 à 10 créas en quelques minutes, pour Meta, Google et TikTok, dans un seul tableau de bord. 24 $ par mois, et un essai de 7 jours."]}, {"t": "9 · Red flags", "p": ["Quatre red flags avant de sortir la carte. QuickAds : des clients facturés avant la fin de l'essai gratuit, remboursement refusé. Creatopy : une interface jugée buguée depuis le changement de marque, et des exports facturés en crédits. AdMaker de PicsArt : aucune veille, et chaque génération se paie. Et Canva : aucune génération depuis une source, tout le montage reste à faire."]}, {"t": "10 · Quel outil pour quel besoin", "p": ["Petit budget et veille : AdMakeAI. Agence qui veut du scoring : AdCreative.ai, avec un budget large. E-commerce sur Shopify : Predis.ai. Charte de marque stricte : Creatopy. Tester le dynamique sans gros budget : Omneky. Contrôle créatif total : Canva, à combiner avec un outil IA."]}, {"t": "11 · Résumé", "p": ["En résumé : compte les créas, pas les 39 $. Choisis ta logique : veille, scoring ou design. Compare le volume réel : 500 crédits, ou 10 téléchargements. Lis les conditions d'essai avant de donner ta carte. Et teste avec un essai gratuit avant de t'engager à l'année.", "Ce sont des scores éditoriaux, des avis G2, Capterra et Trustpilot et les prix d'août 2026. Je n'ai pas testé ces outils moi-même. Le comparatif complet est sur reflex-ia.com."]}], "mots": 666}];
const tabs=document.getElementById('tabs'),view=document.getElementById('view');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const short=['Shorts','Avatars vidéo','GEO','Agents autonomes','Agents de code','Pubs'];
function show(i){
  i=Math.max(0,Math.min(D.length-1,i));
  [...tabs.children].forEach((b,k)=>b.setAttribute('aria-selected',k===i));
  const d=D[i];
  view.innerHTML='<div class="head"><h2>'+esc(d.titre)+'</h2><button class="copy" id="cp">Copier le texte</button></div>'+
   '<p class="meta">'+d.n+' slides · environ '+d.mots+' mots · '+Math.round(d.mots/150)+' min à voix posée</p>'+
   d.secs.map(s=>'<section class="s"><span class="tag">'+esc(s.t)+'</span>'+s.p.map(p=>'<p>'+esc(p)+'</p>').join('')+'</section>').join('');
  document.getElementById('cp').onclick=async e=>{
    const txt=d.secs.map(s=>s.p.join('\n')).join('\n\n');const b=e.target;
    try{await navigator.clipboard.writeText(txt);b.textContent='Copié'}catch(_){
      const r=document.createRange();r.selectNodeContents(view);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent='Texte sélectionné'}
    setTimeout(()=>b.textContent='Copier le texte',1800)};
  try{history.replaceState(null,'','#c'+(i+1))}catch(_){location.hash='c'+(i+1)}
}
D.forEach((d,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.textContent=(i+1)+' · '+short[i];b.onclick=()=>show(i);tabs.appendChild(b)});
addEventListener('hashchange',()=>{const m=/^#c(\d)$/.exec(location.hash);if(m)show(+m[1]-1)});
const m=/^#c(\d)$/.exec(location.hash);show(m?+m[1]-1:0);
</script>
