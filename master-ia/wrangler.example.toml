# Pour le dev local / la CLI : copier à la racine sous le nom wrangler.toml (non committé ici, pour ne pas
# modifier le déploiement existant d'AppMétier). En production, tout peut aussi se régler dans le tableau de
# bord Cloudflare (Pages → Settings → Bindings / Variables and Secrets).
name = "appmetier"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "MASTER_IA_DB"
database_name = "master-ia"
database_id = "REMPLACER-PAR-L-ID-RETOURNE-PAR-wrangler-d1-create"
