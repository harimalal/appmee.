<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151A" media="(prefers-color-scheme: dark)">
<title>Jette</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A5%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F4F1EA; --card:#FFFFFF; --ink:#1F1E24; --muted:#77747D; --line:#E6E1D6;
    --accent:#4B5BD6; --accent-ink:#FFFFFF; --chip:#EAE5D9; --shadow:0 10px 30px rgba(40,34,20,.10), 0 2px 6px rgba(40,34,20,.06);
    --r:28px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16151A; --card:#222128; --ink:#F1EFF5; --muted:#9A97A3; --line:#303038;
      --accent:#8A96FF; --accent-ink:#13131A; --chip:#2A2931; --shadow:0 10px 30px rgba(0,0,0,.45); }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  header{display:flex;align-items:baseline;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 22px 4px}
  header h1{margin:0;font-size:20px;letter-spacing:-.02em}
  #count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

  /* --- Le paquet de cartes : on swipe de gauche à droite --- */
  #deck{flex:1;min-height:0;display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    padding:14px max(7vw,calc((100vw - 440px)/2)) 18px;scroll-padding:0 max(7vw,calc((100vw - 440px)/2));
    scrollbar-width:none;overscroll-behavior-x:contain}
  #deck::-webkit-scrollbar{display:none}
  .card{flex:0 0 min(86vw,440px);scroll-snap-align:center;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
    padding:26px 24px 18px;display:flex;flex-direction:column;overflow:hidden;position:relative;transition:opacity .3s,transform .3s}
  .card.leaving{opacity:0;transform:scale(.94)}
  .emoji{font-size:56px;line-height:1;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:23px;line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
  .meta{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600;
    background:hsl(var(--h) 70% 90%);color:hsl(var(--h) 55% 28%)}
  @media (prefers-color-scheme: dark){ .pill{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 80% 85%)} }
  ul.steps{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0}
  .steps li{margin:0}
  .step{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:9px 2px;border-radius:12px}
  .step:active{background:var(--chip)}
  .dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;
    font-size:13px;color:transparent;transition:.15s}
  .step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .step.done span:last-child{color:var(--muted);text-decoration:line-through}
  .foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .foot button{background:none;border:0;padding:8px 12px;border-radius:99px;color:var(--muted);font-size:14px}
  .foot .ok{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .raw{color:var(--muted);font-size:14px;margin:0 0 12px;overflow-wrap:anywhere}
  .err{color:#B3261E;font-size:14px;margin:0 0 10px}
  @media (prefers-color-scheme: dark){ .err{color:#FF8A80} }
  .retry{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:9px 16px;font-weight:600}

  /* Carte en cours de réflexion */
  .card.pending .emoji{animation:bob 1.1s ease-in-out infinite}
  .skel{height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,var(--chip) 25%,var(--line) 50%,var(--chip) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
  .skel:nth-child(2){width:80%} .skel:nth-child(3){width:60%}
  @keyframes sh{to{background-position:-200% 0}}
  @keyframes bob{50%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} #deck{scroll-behavior:auto} }

  .empty{flex:1 1 100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:0 30px}
  .empty b{display:block;font-size:44px;margin-bottom:8px}

  /* --- Bas de l'écran : thèmes, puis champ --- */
  #dock{padding:6px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 78%,transparent)}
  #auth{display:none;margin:0 16px 10px;padding:12px;border-radius:18px;background:var(--chip);gap:8px;align-items:center}
  #auth.show{display:flex}
  #auth input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit}
  #auth small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
  #auth button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:9px 14px;font-weight:600}
  #chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid transparent;background:var(--chip);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
  .chip i{font-style:normal;color:var(--muted);margin-left:5px;font-size:12px}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .chip[aria-pressed="true"] i{color:inherit;opacity:.7}
  form{display:flex;gap:10px;padding:0 16px}
  #idea{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:15px 20px;font:inherit;font-size:17px;box-shadow:var(--shadow)}
  #idea::placeholder{color:var(--muted)}
  #idea:focus{outline:none;border-color:var(--accent)}
  #send{flex:0 0 52px;height:52px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:700}
  #send:disabled{opacity:.4}
  .nav{display:none}
  @media (hover:hover) and (min-width:720px){
    .nav{display:grid;place-items:center;position:fixed;top:42%;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:20px;z-index:2}
    #prev{left:max(12px,calc(50% - 330px))} #next{right:max(12px,calc(50% - 330px))}
    .nav[hidden]{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>📥 Jette</h1>
  <span id="count" aria-live="polite"></span>
</header>

<main id="deck" aria-label="Tes cartes, à faire défiler"></main>
<button class="nav" id="prev" aria-label="Carte précédente">‹</button>
<button class="nav" id="next" aria-label="Carte suivante">›</button>

<div id="dock">
  <div id="auth" role="group" aria-label="Accès">
    <div style="flex:1;min-width:0">
      <small>Pour que Claude décortique tes idées, entre ton jeton (le même que le cockpit).</small>
      <input id="tok" type="password" autocomplete="current-password" placeholder="Jeton d'accès">
    </div>
    <button id="tokSave" type="button">OK</button>
  </div>
  <nav id="chips" aria-label="Thèmes"></nav>
  <form id="form" autocomplete="off">
    <input id="idea" type="text" placeholder="Jette une idée…" enterkeyhint="send" maxlength="600" aria-label="Ton idée">
    <button id="send" type="submit" aria-label="Ajouter" disabled>↑</button>
  </form>
</div>

<script>
(function(){
  'use strict';
  var CARDS_KEY = 'jette.cards', TOKEN_KEY = 'cockpit.token'; // même jeton que le cockpit (même origine)

  function read(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function write(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }

  var cards = [];
  try { cards = JSON.parse(read(CARDS_KEY) || '[]'); if (!Array.isArray(cards)) cards = []; } catch(e){ cards = []; }
  var token = read(TOKEN_KEY) || '';
  var filter = null; // null = tout | un thème | '__done'

  var $ = function(id){ return document.getElementById(id); };
  var deck = $('deck'), chips = $('chips'), idea = $('idea'), send = $('send');

  function save(){ write(CARDS_KEY, JSON.stringify(cards)); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
  function hue(tag){ var h = 0, s = norm(tag); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function known(){ var seen = {}, out = []; cards.forEach(function(c){ if (c.tag && !seen[norm(c.tag)]){ seen[norm(c.tag)] = 1; out.push(c.tag); } }); return out; }

  /* ---------- Rendu ---------- */
  function visible(){
    return cards.filter(function(c){
      if (filter === '__done') return c.status === 'done';
      if (c.status === 'done') return false;
      return !filter || norm(c.tag) === norm(filter);
    });
  }

  function cardHTML(c){
    var h = hue(c.tag || 'x');
    if (c.status === 'pending') {
      return '<article class="card pending" data-id="' + c.id + '"><div class="emoji">⏳</div><h2>' + esc(c.text) + '</h2>' +
        '<div class="meta">Je décortique…</div><div class="skel"></div><div class="skel"></div><div class="skel"></div></article>';
    }
    if (c.status === 'error') {
      return '<article class="card" data-id="' + c.id + '"><div class="emoji">🫥</div><h2>' + esc(c.text) + '</h2>' +
        '<p class="err">' + esc(c.err || 'Pas pu décortiquer pour l\'instant.') + '</p>' +
        '<button class="retry" data-act="retry">Réessayer</button><div style="flex:1"></div>' +
        '<div class="foot"><button data-act="del">Supprimer</button></div></article>';
    }
    var done = c.steps.filter(function(s){ return s.done; }).length;
    var steps = c.steps.map(function(s, i){
      return '<li><button class="step' + (s.done ? ' done' : '') + '" data-act="step" data-i="' + i + '" aria-pressed="' + !!s.done + '">' +
        '<span class="dot">✓</span><span>' + esc(s.t) + '</span></button></li>';
    }).join('');
    return '<article class="card" data-id="' + c.id + '" style="--h:' + h + '"><div class="emoji">' + esc(c.emoji) + '</div>' +
      '<h2>' + esc(c.title) + '</h2>' +
      '<div class="meta"><span class="pill">' + esc(c.tag) + '</span><span class="prog">' + done + '/' + c.steps.length + '</span></div>' +
      '<ul class="steps">' + steps + '</ul>' +
      '<div class="foot"><button data-act="del">Supprimer</button>' +
      (c.status === 'done' ? '<button data-act="reopen">Rouvrir</button>' : '<button class="ok" data-act="done">Fait ✓</button>') +
      '</div></article>';
  }

  function render(keepScroll){
    var x = deck.scrollLeft;
    var list = visible();
    deck.innerHTML = list.length ? list.map(cardHTML).join('') :
      '<div class="empty"><div><b>' + (filter === '__done' ? '🎉' : '✨') + '</b>' +
      (filter === '__done' ? 'Rien de terminé pour l\'instant.' : (cards.some(function(c){ return c.status !== 'done'; }) ? 'Aucune carte dans ce thème.' : 'Jette ta première idée en bas.<br>Je m\'occupe du reste.')) +
      '</div></div>';
    if (keepScroll) deck.scrollLeft = x;
    renderChips(); updateCount();
  }

  function renderChips(){
    var open = cards.filter(function(c){ return c.status !== 'done' && c.status !== 'pending' && c.status !== 'error'; });
    var counts = {}, order = [];
    open.forEach(function(c){ var k = norm(c.tag); if (!counts[k]){ counts[k] = { label: c.tag, n: 0 }; order.push(k); } counts[k].n++; });
    var hasDone = cards.some(function(c){ return c.status === 'done'; });
    var html = '<button class="chip" data-f="" aria-pressed="' + (filter === null) + '">Tout<i>' + cards.filter(function(c){ return c.status !== 'done'; }).length + '</i></button>';
    order.sort(function(a, b){ return counts[b].n - counts[a].n || counts[a].label.localeCompare(counts[b].label, 'fr'); }).forEach(function(k){
      html += '<button class="chip" data-f="' + esc(counts[k].label) + '" aria-pressed="' + (filter !== null && filter !== '__done' && norm(filter) === k) + '">' + esc(counts[k].label) + '<i>' + counts[k].n + '</i></button>';
    });
    if (hasDone) html += '<button class="chip" data-f="__done" aria-pressed="' + (filter === '__done') + '">✓ Faites</button>';
    chips.innerHTML = html;
  }

  function updateCount(){
    var n = visible().length;
    if (!n) { $('count').textContent = ''; $('prev').hidden = $('next').hidden = true; return; }
    var i = Math.min(n, Math.max(1, currentIndex() + 1));
    $('count').textContent = i + ' / ' + n;
    $('prev').hidden = i <= 1; $('next').hidden = i >= n;
  }

  function currentIndex(){
    var els = deck.querySelectorAll('.card');
    if (!els.length) return 0;
    var mid = deck.scrollLeft + deck.clientWidth / 2, best = 0, bd = 1e9;
    els.forEach(function(el, i){ var d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid); if (d < bd){ bd = d; best = i; } });
    return best;
  }

  function goTo(i){
    var els = deck.querySelectorAll('.card');
    if (!els[i]) return;
    deck.scrollTo({ left: els[i].offsetLeft - (deck.clientWidth - els[i].offsetWidth) / 2, behavior: 'smooth' });
  }

  /* ---------- Claude décortique ---------- */
  function showAuth(on){ $('auth').classList.toggle('show', !!on); }

  function think(c){
    c.status = 'pending'; c.err = ''; save();
    if (!token) { fail(c, 'Il me faut ton jeton pour décortiquer cette idée.'); showAuth(true); return; }
    fetch('/api/jette', {
      method: 'POST',
      headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ text: c.text, tags: known() })
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok, status: r.status, d: d }; });
    }).then(function(res){
      if (res.status === 401) { token = ''; write(TOKEN_KEY, null); showAuth(true); return fail(c, 'Jeton refusé : entre-le à nouveau.'); }
      if (!res.ok || !res.d.title) return fail(c, res.d.error || 'Pas pu décortiquer pour l\'instant.');
      c.emoji = res.d.emoji; c.title = res.d.title; c.tag = res.d.tag;
      c.steps = (res.d.steps || []).map(function(t){ return { t: t, done: false }; });
      c.status = 'ready'; save(); render(true);
    }).catch(function(){ fail(c, 'Pas de connexion. Ton idée est gardée, réessaie plus tard.'); });
  }

  function fail(c, msg){ c.status = 'error'; c.err = msg; save(); render(true); }

  /* ---------- Actions ---------- */
  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var text = idea.value.trim();
    if (!text) return;
    var c = { id: uid(), text: text, emoji: '', title: '', tag: '', steps: [], status: 'pending', err: '', at: Date.now() };
    cards.unshift(c);
    idea.value = ''; send.disabled = true;
    filter = null; save(); render();
    deck.scrollLeft = 0;
    think(c);
  });
  idea.addEventListener('input', function(){ send.disabled = !idea.value.trim(); });

  deck.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b) return;
    var el = b.closest('.card'), c = cards.filter(function(x){ return x.id === el.dataset.id; })[0];
    if (!c) return;
    var act = b.dataset.act;
    if (act === 'step') {
      var s = c.steps[+b.dataset.i]; s.done = !s.done; save();
      b.classList.toggle('done', s.done); b.setAttribute('aria-pressed', s.done);
      el.querySelector('.prog').textContent = c.steps.filter(function(x){ return x.done; }).length + '/' + c.steps.length;
    } else if (act === 'done' || act === 'reopen') {
      c.status = act === 'done' ? 'done' : 'ready'; save();
      el.classList.add('leaving'); setTimeout(function(){ render(true); }, 280);
    } else if (act === 'del') {
      if (!confirm('Supprimer cette carte ?')) return;
      cards = cards.filter(function(x){ return x !== c; });
      if (filter && !cards.some(function(x){ return filter === '__done' ? x.status === 'done' : x.status !== 'done' && norm(x.tag) === norm(filter); })) filter = null;
      save(); el.classList.add('leaving'); setTimeout(function(){ render(true); }, 280);
    } else if (act === 'retry') {
      render(true); think(c);
    }
  });

  chips.addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    var f = b.dataset.f;
    filter = (f === '' || (filter !== null && norm(filter) === norm(f))) ? null : f;
    render(); deck.scrollLeft = 0;
  });

  $('tokSave').addEventListener('click', saveToken);
  $('tok').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); saveToken(); } });
  function saveToken(){
    var v = $('tok').value.trim(); if (!v) return;
    token = v; write(TOKEN_KEY, token); $('tok').value = ''; showAuth(false);
    cards.filter(function(c){ return c.status === 'error' || c.status === 'pending'; }).forEach(think);
  }

  var tick = 0;
  deck.addEventListener('scroll', function(){ if (!tick) tick = requestAnimationFrame(function(){ tick = 0; updateCount(); }); }, { passive: true });
  $('prev').addEventListener('click', function(){ goTo(currentIndex() - 1); });
  $('next').addEventListener('click', function(){ goTo(currentIndex() + 1); });
  document.addEventListener('keydown', function(e){
    if (e.target === idea && idea.value) return;
    if (e.key === 'ArrowRight') goTo(currentIndex() + 1);
    if (e.key === 'ArrowLeft') goTo(currentIndex() - 1);
  });
  window.addEventListener('resize', updateCount);

  /* ---------- Démarrage ---------- */
  render();
  // Une idée restée "en réflexion" (page fermée au mauvais moment) repart toute seule.
  cards.filter(function(c){ return c.status === 'pending'; }).forEach(think);
})();
</script>
</body>
</html>
