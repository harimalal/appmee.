<!--
  Reel Instagram 9:16 (1080x1920, 30 fps) — version « histoire » : on raconte POURQUOI des pages d'un site ne sont pas indexées par Google,
  comment on a trouvé les causes, puis ce qui a été corrigé et mesuré.
  Page PILOTÉE PAR LE TEMPS : window.__setTime(t) redessine l'état exact à l'instant t. Les instants viennent de timeline.js
  (calculé par plan.py à partir de la durée réelle de la voix). Aucune animation sur l'horloge réelle : rendu déterministe.
  window.EVENTS = événements sonores (type, instant) pour synth.cjs : une seule source de vérité pour l'image et le son.
  ?debug=1 affiche les zones sûres.
-->

<body>
<div id="stage"></div>
<script src="timeline.js"></script>
<script>
(() => {
'use strict';
const W = 1080, H = 1920;
const SAFE = { x0: 84, x1: 930, y0: 200, y1: 1540 };
const TL = window.TIMELINE, TOTAL = TL.total, NSC = TL.scenes.length;
const stage = document.getElementById('stage');
const EV = []; const ev = (type, t, o = {}) => EV.push(Object.assign({ type, t: Math.round(t * 1000) / 1000 }, o));

/* ---------- utilitaires ---------- */
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, d) => cl((t - a) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const eoExp = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eoBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const mk = (parent, cls, html) => { const e = document.createElement('div'); e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
const place = (e, x, y, w, h) => { e.style.left = x + 'px'; e.style.top = y + 'px'; if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px'; return e; };
const put = (e, o = {}) => { const { x = 0, y = 0, s = 1, r = 0, op = 1 } = o; e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; e.style.opacity = op; };
const enter = (e, t, a, o = {}) => { const { dx = 0, dy = 40, s0 = .94, d = .5, back = true } = o; const p = P(t, a, d), k = back ? eoBack(p) : eo(p); put(e, { x: dx * (1 - k), y: dy * (1 - k), s: s0 + (1 - s0) * k, op: cl(p * 2.2) }); return p; };
const capOp = (e, v) => { e.style.opacity = Math.min(parseFloat(e.style.opacity), v); };
const hlSet = (root, p) => root.querySelectorAll('.hl').forEach(h => h.style.setProperty('--p', p));
const txt = (parent, cls, html, x, y, w, h) => { const e = mk(parent, 'abs tx ' + cls, html); place(e, x, y, w, h); return e; };
const circle = (root, col) => { const c = mk(root, 'abs circle', null); c.dataset.bleed = ''; place(c, 500, -330, 900, 900); c.style.background = col || 'rgba(108,92,231,.10)'; return c; };
const drift = (c, t) => put(c, { x: Math.sin(t * .7) * 26, y: Math.cos(t * .55) * 22 });
const svgNS = 'http://www.w3.org/2000/svg';

const ICON = {
  check: (c = '#fff') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><path d="M11 25l9 9 17-19" fill="none" stroke="${c}" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:var(--d,0)"/></svg>`,
  cross: (c = '#fff') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><path d="M13 13l22 22M35 13L13 35" fill="none" stroke="${c}" stroke-width="6.5" stroke-linecap="round"/></svg>`,
  doc: (c = '#6C5CE7') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><path d="M12 5h17l9 9v29H12z" fill="none" stroke="${c}" stroke-width="3.6" stroke-linejoin="round"/><path d="M29 5v9h9M18 24h14M18 31h14M18 38h8" fill="none" stroke="${c}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  mag: (c = '#19A974') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><circle cx="21" cy="21" r="12" fill="none" stroke="${c}" stroke-width="4"/><path d="M30 30l13 13" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/></svg>`,
  clock: (c = '#FFD93B') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><circle cx="24" cy="24" r="19" fill="none" stroke="${c}" stroke-width="4"/><path d="M24 12v13l9 5" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  chev: () => `<svg viewBox="0 0 48 48" width="52" height="52"><path d="M18 12l-12 12 12 12M30 12l12 12-12 12" fill="none" stroke="#0F1020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  target: (c = '#6C5CE7') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><circle cx="24" cy="24" r="19" fill="none" stroke="${c}" stroke-width="4"/><circle cx="24" cy="24" r="11" fill="none" stroke="${c}" stroke-width="4"/><circle cx="24" cy="24" r="3.5" fill="${c}"/></svg>`
};

/* ---------- chrome persistant ---------- */
const chrome = mk(stage, 'chrome', null); chrome.style.cssText = 'position:absolute;inset:0;z-index:100;pointer-events:none';
const brand = mk(chrome, 'abs brand', '<span data-deco>REFLEX</span><i class="dot"></i><span data-deco>IA</span>'); place(brand, 84, 206);
const counter = mk(chrome, 'abs counter', '1/' + NSC); counter.dataset.deco = ''; place(counter, SAFE.x1 - 150, 212, 150, 64);

/* ---------- légendes synchronisées sur la voix ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function caption(root, m) {
  const wrap = mk(root, 'abs', null); place(wrap, 88, 1170, 842, 380);
  const items = m.sent.map(s => { const el = mk(wrap, 'tx cap', s.words.map(w => `<span class="w f">${esc(w.w)}</span>`).join(' ')); el.style.display = 'none'; return { s, el, spans: [...el.querySelectorAll('.w')] }; });
  return t => {
    let act = -1; items.forEach((it, i) => { if (t >= it.s.start - .08) act = i; });
    items.forEach((it, i) => {
      const on = i === act; it.el.style.display = on ? 'block' : 'none'; if (!on) return;
      const e = P(t, it.s.start - .08, .25); it.el.style.opacity = e; it.el.style.transform = `translateY(${(1 - eo(e)) * 22}px)`;
      it.spans.forEach((sp, k) => { const w = it.s.words[k]; const c = t >= w.t1 ? 'p' : (t >= w.t0 ? 'c' : 'f'); if (sp.className !== 'w ' + c) sp.className = 'w ' + c; });
    });
  };
}

/* ---------- registre des scènes ---------- */
const SC = [];
const scene = (id, copy, fn) => {
  const m = TL.scenes.find(s => s.id === id);
  const root = mk(stage, 'scene', null); root.style.background = m.bg; root.style.zIndex = SC.length + 1;
  const upd = fn(root, m);
  const cap = m.caption ? caption(root, m) : null;
  SC.push({ id, m, root, upd, cap, copy: [...copy, ...(m.caption ? m.sent.map(s => s.cap) : [])] });
};
const pageCard = () => '<div class="pgbar"></div><div class="pgl" style="width:80%"></div><div class="pgl"></div><div class="pgl" style="width:60%"></div>';
const badge = (bg, icon) => `<div class="badge" style="background:${bg}">${icon}</div>`;
const popBadge = (e, p) => { const b = e.querySelector('.badge'); b.style.opacity = p > 0 ? 1 : 0; b.style.transform = `scale(${p > 0 ? eoBack(p) : 0})`; };

/* ===== SCÈNES du reel « Comment j'ai publié 81 articles de blog longs » ===== */
const card = (root, name, sub, y, h, hot, ic) => { const e = mk(root, 'abs', `<div class="tx" style="position:absolute;left:34px;top:${hot ? 24 : 22}px;font:900 ${hot ? 50 : 44}px/1 var(--font);letter-spacing:-.025em">${name}</div><div class="tx" style="position:absolute;left:34px;top:${hot ? 92 : 82}px;right:${ic ? 140 : 30}px;font:600 ${hot ? 33 : 30}px/1.18 var(--font);color:${hot ? 'var(--ink)' : 'var(--muted)'}">${sub}</div>`); e.style.cssText += `;background:#fff;border-radius:30px;box-shadow:0 16px 44px rgba(30,60,90,.14)${hot ? ';border:6px solid var(--violet)' : ''}`; place(e, 84, y, 846, h); if (ic) { const l = mk(e, '', ic); l.style.cssText += ';position:absolute;right:28px;top:26px;width:92px;height:92px'; l.dataset.deco = ''; } return e; };
const LOGO = '<img class="cdlogo" src="assets/claude.png" alt="">';

/* 1 — titre : hook C (problème), A (question), B (28 comparatifs) ; grille de 28 carrés = 28 comparatifs */
scene('titre', ["Comment j'ai comparé les outils IA en 28 comparatifs"], (root, m) => {
  const [t0, t1, t2] = m.sent;
  const c = circle(root, 'rgba(242,153,74,.14)');
  const lg = mk(root, 'abs', LOGO); place(lg, 450, 330, 180, 180); lg.dataset.deco = '';
  const ti = txt(root, 'ttl', "Comment j'ai comparé les outils IA en <span class=\"hl\">28 comparatifs</span>", 84, 560, 846, 330); ti.style.fontSize = '80px';
  const grid = mk(root, 'abs', ''); place(grid, 84, 930, 846, 130); grid.dataset.deco = '';
  const BAND = [[17, '#CFC9F5'], [5, '#6C5CE7'], [6, '#FFD93B']], sq = [];
  BAND.forEach(([n, col]) => { for (let k = 0; k < n; k++) { const q = mk(grid, '', ''); const idx = sq.length; q.style.cssText = `position:absolute;left:${(idx % 14) * 60}px;top:${Math.floor(idx / 14) * 60}px;width:48px;height:48px;border-radius:12px;background:${col}`; sq.push(q); } });
  const G0 = t1.start, GD = Math.max(1.5, (t2.start + 3) - G0);
  ev('thump', 0, { amp: .9 }); ev('pop', .1); ev('swipe', .8); ev('whoosh', t1.start - .05, { dur: .35 }); for (let k = 0; k < 7; k++) ev('pop', G0 + (k / 7) * GD * .9); ev('ding', t2.start + 2.6, { f: 1046 });
  return t => {
    drift(c, t);
    const lp = P(t, .02, .6); put(lg, { s: eoBack(lp), r: -90 * (1 - eo(lp)) + t * 14, op: cl(lp * 3) });
    enter(ti, t, .15, { dy: 40, d: .55 }); hlSet(ti, P(t, .75, .5));
    sq.forEach((q, k) => { const p = P(t, G0 + (k / 28) * GD, .25); q.style.opacity = p; q.style.transform = `scale(${.4 + .6 * eoBack(p)})`; });
  };
});

/* 2 — le système : un skill + un système (complet), face à une simple demande ChatGPT / Claude (superficielle) */
scene('systeme', ['Un skill + un système', '✓', '1', '2', 'Un skill et un système', 'complet : tous les paramètres du type', 'Simple demande ChatGPT / Claude', 'superficiel · critères génériques', 'Les critères qui comptent', 'indispensables pour ce type', 'Chaque outil noté', "recherches · rien d'inventé"], (root, m) => {
  const [s0, s0b, s2, s3] = m.sent;
  const c = circle(root, 'rgba(25,169,116,.10)');
  const head = mk(root, 'abs tx', 'Un skill + un système'); head.style.cssText += ';background:#0F1020;color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;font:900 40px/1 var(--font);letter-spacing:-.02em'; place(head, 84, 296, 560, 80);
  const rowH = (n, name, sub, y, col) => { const e = mk(root, 'abs res', `<div class="tx" style="position:absolute;left:28px;top:0;bottom:0;width:70px;display:flex;align-items:center;font:900 52px/1 var(--font);color:${col};letter-spacing:-.03em">${n}</div><div class="tx" style="position:absolute;left:112px;top:16px;font:900 40px/1 var(--font);letter-spacing:-.025em">${name}</div><div class="tx" style="position:absolute;left:112px;top:68px;right:20px;font:600 27px/1.1 var(--font);color:var(--muted)">${sub}</div>`); place(e, 84, y, 846, 112); e.style.borderRadius = '28px'; return e; };
  const A = rowH('✓', 'Un skill et un système', 'complet : tous les paramètres du type', 400, 'var(--green)');
  const B = mk(root, 'abs cause', `<div class="cl"><span class="tx">Simple demande ChatGPT / Claude</span></div><div class="bd" style="background:var(--red)">${ICON.cross()}</div>`); place(B, 84, 540, 846, 120); B.querySelector('.cl').style.cssText += ';font-size:34px;top:-18px'; const Bs = mk(B, 'tx', 'superficiel · critères génériques'); Bs.style.cssText += ';position:absolute;left:36px;top:70px;font:600 27px/1.1 var(--font);color:var(--muted)'; const Bbd = B.querySelector('.bd');
  const C = rowH('1', 'Les critères qui comptent', 'indispensables pour ce type', 690, 'var(--violet)');
  const D = rowH('2', 'Chaque outil noté', "recherches · rien d'inventé", 820, 'var(--violet)');
  const X = s0b.start + 3.2;
  ev('whoosh', s0.start, { dur: .4 }); ev('pop', s0.start + .4); ev('swipe', s0.start + 1.2); ev('swipe', s0b.start + .3); ev('thunk', X, { amp: .85 }); ev('pop', s2.start + .3); ev('pop', s3.start + .3); ev('ding', s3.start + 2.6, { f: 988 });
  return t => {
    drift(c, t);
    enter(head, t, s0.start + .2, { dy: 30, d: .4 });
    enter(A, t, s0.start + 1.0, { dx: -60, dy: 0, d: .45 });
    enter(B, t, s0b.start + .3, { dx: -60, dy: 0, d: .45 }); const xp = P(t, X, .4); Bbd.style.opacity = xp > 0 ? 1 : 0; Bbd.style.transform = `scale(${xp > 0 ? eoBack(xp) : 0})`;
    enter(C, t, s2.start + .3, { dx: -60, dy: 0, d: .45 }); enter(D, t, s3.start + .3, { dx: -60, dy: 0, d: .45 });
    [A, B, C, D].forEach((e, i) => { e.style.transform += ` translateY(${Math.sin(t * 1.8 + i * 1.2) * 4}px)`; });
  };
});

/* 3 — les critères changent : 3 exemples réels, lus dans l'en-tête des tableaux publiés */
const CRI = [['Voix IA', ['Qualité', 'Clonage', 'Langues', 'Prix'], '#ECEAFD', '#4B3FC9'], ['Assistants de code', ['Suggestions', 'Agentique', 'IDE', 'Prix'], '#E3EFFD', '#1B5FBF'], ['CRM & marketing', ['CRM & Pipeline', 'Marketing auto.', 'IA native', 'Prix'], '#E3F6EE', '#0B7A55']];
scene('criteres', ['Le piège : les mêmes critères pour tous', ...CRI.flatMap(([n, ch]) => [n, ...ch])], (root, m) => {
  const [c1, c2, c3, c4] = m.sent;
  const c = circle(root, 'rgba(108,92,231,.10)');
  const head = mk(root, 'abs tx', 'Le piège : les mêmes critères pour tous'); head.style.cssText += ';background:#E5383B;color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;font:900 34px/1 var(--font);letter-spacing:-.02em'; place(head, 84, 296, 846, 80);
  const cards = CRI.map(([name, chips, bg, fg], i) => {
    const e = mk(root, 'abs res', `<div class="tx" style="position:absolute;left:34px;top:20px;font:900 46px/1 var(--font);letter-spacing:-.025em">${name}</div>`); place(e, 84, 400 + i * 290, 846, 262);
    const cs = chips.map((ch, k) => { const q = mk(e, 'tx', ch); q.style.cssText += `;position:absolute;left:${34 + (k % 2) * 404}px;top:${96 + Math.floor(k / 2) * 76}px;width:388px;height:62px;border-radius:999px;background:${bg};color:${fg};display:flex;align-items:center;justify-content:center;font:800 30px/1 var(--font)`; return q; });
    return { e, cs };
  });
  const S0 = [c2, c3, c4];
  ev('whoosh', c1.start, { dur: .4 }); ev('pop', c1.start + .5);
  [0, 1, 2].forEach(i => ev('swipe', c1.start + .4 + i * .55));
  S0.forEach((s, i) => { for (let k = 0; k < 4; k++) ev('pop', s.start + .5 + k * .55); });
  return t => {
    drift(c, t);
    enter(head, t, c1.start + .2, { dy: 30, d: .4 });
    cards.forEach((o, i) => {
      enter(o.e, t, c1.start + .4 + i * .55, { dy: 50, d: .5 });
      o.cs.forEach((q, k) => { const p = P(t, S0[i].start + .5 + k * .55, .3); q.style.opacity = p; q.style.transform = `scale(${.6 + .4 * eoBack(p)})`; });
      o.e.style.transform += ` translateY(${Math.sin(t * 1.7 + i * 1.3) * 5}px)`;
    });
  };
});

/* 4 — les comparatifs à l'écran : 3 vrais tableaux (voix IA, assistants de code, CRM), grands, avec balayage horizontal */
const TAB = [['tableau-voix.jpg', 2072, 1762, 'Comparatif : voix IA'], ['tableau-code.jpg', 2360, 1678, 'Comparatif : assistants de code'], ['tableau-crm.jpg', 2236, 1666, 'Comparatif : CRM & marketing']];
scene('tableau', ['score /20', ...TAB.map(x => x[3])], (root, m) => {
  const [tb1, d2] = m.sent;
  const c = circle(root, 'rgba(229,56,100,.08)');
  const frame = mk(root, 'abs', ''); frame.style.cssText += ';background:#fff;border-radius:30px;box-shadow:0 28px 72px rgba(60,30,60,.22);overflow:hidden'; place(frame, 40, 300, 1000, 1150);
  const hd = mk(frame, '', ''); hd.style.cssText += ';position:absolute;left:0;right:0;top:0;height:84px;background:#FFF';
  const lab = mk(hd, 'tx', TAB[0][3]); lab.style.cssText += ';position:absolute;left:44px;top:0;bottom:0;display:flex;align-items:center;font:900 34px/1 var(--font);letter-spacing:-.02em';
  const lb2 = mk(hd, 'tx', 'score /20'); lb2.style.cssText += ';position:absolute;right:112px;top:0;bottom:0;display:flex;align-items:center;font:600 28px/1 var(--mono);color:var(--muted)';
  const bar = mk(hd, '', ''); bar.style.cssText += ';position:absolute;left:0;right:0;bottom:0;height:5px;background:#E5383B';
  const view = mk(frame, '', ''); view.style.cssText += ';position:absolute;left:20px;top:94px;width:960px;height:1040px;overflow:hidden;background:#fff;border-radius:16px'; view.dataset.deco = '';
  const W = 1500;
  const caps = TAB.map(([f, iw, ih]) => { const H = W * ih / iw; const im = document.createElement('img'); im.src = 'assets/captures/' + f; im.style.cssText = `display:block;position:absolute;left:0;top:0;width:${W}px;height:${H}px`; view.appendChild(im); return { im, H }; });
  const T0 = m.start + .4, END = m.end - .3, SEG = (END - T0) / 3;
  ev('whoosh', m.start, { dur: .4 }); ev('swipe', m.start + .3); for (let k = 0; k < 2; k++) ev('swipe', T0 + (k + 1) * SEG - SEG * .1); ev('pop', d2.start + .2);
  return t => {
    drift(c, t);
    enter(frame, t, m.start + .05, { dy: 70, d: .6 });
    const u = Math.max(0, (t - T0) / SEG), k = Math.min(2, Math.floor(u)), fr = u - k;
    const sw = k >= 2 ? 0 : io(cl((fr - .86) / .14)), pos = k + sw;
    caps.forEach((o, q) => { const pp = q < k ? 1 : q === k ? io(cl(fr / .86)) : 0; o.im.style.transform = `translate(${(q - pos) * 960 - 540 * pp}px, ${-Math.max(0, o.H - 1040) * pp * .5}px)`; });
    lab.textContent = TAB[Math.min(2, Math.round(pos))][3];
    frame.style.transform += ` translateY(${Math.sin(t * 1.6) * 5}px)`;
  };
});

/* 4 et 5 — phone frame : vraies captures qui défilent (cas d'usage, profils) */
const phoneScene = (id, labelL, labelR, img, ih, accent, bgc) => scene(id, [labelL, labelR], (root, m) => {
  const [s1] = m.sent;
  const c = circle(root, bgc);
  const frame = mk(root, 'abs', ''); frame.style.cssText += ';background:#fff;border-radius:34px;box-shadow:0 28px 72px rgba(30,40,100,.25);overflow:hidden'; place(frame, 40, 300, 1000, 1150);
  const hd = mk(frame, '', ''); hd.style.cssText += ';position:absolute;left:0;right:0;top:0;height:84px;background:#FFF';
  const lab = mk(hd, 'tx', labelL); lab.style.cssText += ';position:absolute;left:44px;top:0;bottom:0;display:flex;align-items:center;font:900 32px/1 var(--font);letter-spacing:-.02em';
  const cnt = mk(hd, 'tx', labelR); cnt.style.cssText += ';position:absolute;right:112px;top:0;bottom:0;display:flex;align-items:center;font:600 26px/1 var(--mono);color:var(--muted)';
  const bar = mk(hd, '', ''); bar.style.cssText += `;position:absolute;left:0;right:0;bottom:0;height:5px;background:${accent}`;
  const view = mk(frame, '', ''); view.style.cssText += ';position:absolute;left:20px;top:94px;width:960px;height:1040px;overflow:hidden;border-radius:16px;background:#eee'; view.dataset.deco = '';
  const im = document.createElement('img'); im.src = img; im.style.cssText = 'display:block;width:960px;height:auto;position:absolute;left:0;top:0'; view.appendChild(im);
  const maxScroll = ih * 960 / 982 - 1040, T0 = m.start + .5, END = m.end - .5;
  ev('whoosh', m.start, { dur: .4 }); for (let k = 0; k < 4; k++) ev('swipe', T0 + (k + .5) * (END - T0) / 4); ev('ding', m.end - 1.2, { f: 1046 });
  return t => {
    drift(c, t);
    enter(frame, t, m.start + .05, { dy: 70, d: .6 });
    im.style.transform = `translateY(${-io(P(t, T0, END - T0)) * maxScroll}px)`;
    frame.style.transform += ` translateY(${Math.sin(t * 1.6) * 5}px)`;
  };
});
phoneScene('usages', 'Ce que créent les utilisateurs', '6 cas d’usage', 'assets/captures/usages.jpg', 2452, '#2F80ED', 'rgba(60,140,220,.12)');
phoneScene('profils', 'Recommandations par profil', '6 profils', 'assets/captures/profils.jpg', 2222, '#6C5CE7', 'rgba(108,92,231,.10)');

/* 6 — les chiffres + la limite */
scene('chiffres', ['28', "comparatifs, d'août à octobre", '6', 'cas d’usage par comparatif', '6 à 8', 'profils par comparatif', 'notes de mes sources · pas un test indépendant'], (root, m) => {
  const [n2, n3] = m.sent;
  const c = circle(root, 'rgba(242,180,40,.12)');
  const cardC = (num, lab, y, col) => { const e = mk(root, 'abs res', `<div class="tx" style="position:absolute;left:34px;top:34px;font:900 96px/1 var(--font);letter-spacing:-.04em;color:${col}">${num}</div><div class="tx" style="position:absolute;left:34px;top:150px;right:30px;font:700 33px/1.15 var(--font);color:var(--ink)">${lab}</div>`); place(e, 84, y, 846, 250); return e; };
  const e1 = cardC('28', "comparatifs, d'août à octobre", 310, 'var(--violet)'), e2 = cardC('6', 'cas d’usage par comparatif', 590, 'var(--green)'), e3 = cardC('6 à 8', 'profils par comparatif', 870, 'var(--red)');
  const note = mk(root, 'abs tx', 'notes de mes sources · pas un test indépendant'); note.style.cssText += ';background:#0F1020;color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;font:800 32px/1 var(--font);letter-spacing:-.01em'; place(note, 84, 1170, 846, 100);
  const T = [n2.start + .1, n2.start + 1.0, n2.start + 2.0, n3.start + .3];
  ev('whoosh', m.start, { dur: .4 }); [0, 1, 2].forEach((k, i) => { ev('thump', T[i] + .3, { amp: .7 }); ev('ding', T[i] + .5, { f: [880, 988, 1175][i] }); }); ev('pop', T[3]);
  return t => {
    drift(c, t);
    [e1, e2, e3].forEach((e, i) => { enter(e, t, T[i], { dy: 60, d: .5 }); e.style.transform += ` translateY(${Math.sin(t * 1.8 + i) * 7}px) scale(${1 + .012 * Math.sin(t * 2.4 + i)})`; });
    enter(note, t, T[3], { dy: 30, d: .45 });
  };
});

/* 7 — CTA sur bleu nuit, puis « Et ton outil ? » (la fin reboucle sur le titre) */
scene('cta', ['Abonne-toi', "pour plus d'astuces IA", 'sans compétences techniques', 'rapides', 'terriblement efficaces', 'Et ton outil ?'], (root, m) => {
  const [k1] = m.sent;
  const c = circle(root, 'rgba(255,255,255,.05)');
  const cta = mk(root, 'abs cta', `<div class="ci" style="padding:18px"><img class="cdlogo" src="assets/claude.png" alt=""></div><div class="tx c1" style="top:196px;font-size:78px"><span class="hl">Abonne-toi</span></div><div class="tx c2" style="top:300px;font-size:46px;line-height:1.1">pour plus d'astuces IA</div>`); place(cta, 84, 380, 846, 800);
  const chips = ['sans compétences techniques', 'rapides', 'terriblement efficaces'].map((s, i) => { const e = mk(cta, 'tx', s); e.style.cssText += `;position:absolute;left:60px;right:60px;top:${430 + i * 110}px;height:86px;border-radius:999px;background:${['#ECEAFD', '#E3F6EE', '#FFF3CF'][i]};display:flex;align-items:center;justify-content:center;font:800 40px/1 var(--font);letter-spacing:-.02em`; return e; });
  const big = txt(root, 'big', 'Et ton<br>outil ?', 84, 600, 846, 470); big.style.color = '#fff'; big.style.fontSize = '190px'; big.style.lineHeight = '1.02';
  const exitAt = m.end - 1.05, ct = [k1.start + .9, k1.start + 3.0, k1.start + 3.9];
  ev('whoosh', m.start, { dur: .4 }); ev('thump', m.start + .05, { amp: .45 }); ev('swipe', m.start + .6); ct.forEach(a => ev('pop', a)); ev('whoosh', exitAt, { dur: .35, down: true }); ev('thump', exitAt + .3, { amp: 1, big: true });
  return t => {
    drift(c, t);
    enter(cta, t, m.start, { dy: 80, d: .5 }); hlSet(cta, P(t, m.start + .5, .4));
    chips.forEach((e, i) => enter(e, t, ct[i], { dy: 30, d: .4 }));
    if (t > m.start + .6 && t <= exitAt) cta.style.transform = `translateY(${Math.sin((t - m.start - .6) * 3.4) * 7}px)`;
    if (t > exitAt) { const e = io(P(t, exitAt, .35)); cta.style.transform = `translateY(${-220 * e}px) scale(${1 - .1 * e})`; cta.style.opacity = 1 - e; }
    const q = P(t, exitAt + .2, .45); put(big, { s: .8 + .2 * eoBack(q), op: cl(q * 2) });
  };
});

/* ---------- pilotage temporel ---------- */
window.__setTime = t => {
  let idx = 0;
  SC.forEach((s, i) => {
    const last = i === SC.length - 1;
    const vis = t >= s.m.start && t < (last ? TOTAL + 1 : s.m.end + .25);
    s.root.style.display = vis ? 'block' : 'none';
    if (t >= s.m.start) idx = i;
    if (!vis) return;
    const e = i === 0 ? 1 : P(t, s.m.start, .2);
    s.root.style.opacity = e; s.root.style.transform = i === 0 ? 'none' : `translateY(${(1 - eo(e)) * 34}px)`;
    s.upd(t); if (s.cap) s.cap(t);
  });
  counter.textContent = (idx + 1) + '/' + NSC; counter.classList.toggle('dark', SC[idx].id === 'cta');
};
window.REEL = { total: TOTAL, safe: SAFE, scenes: SC.map(s => ({ id: s.id, start: s.m.start, end: s.m.end, copy: s.copy, caps: s.m.caption ? s.m.sent.map(x => x.cap) : [] })) };
window.EVENTS = EV;

/* contrôle qualité : texte visible et boîtes réelles (Range) à l'instant t */
window.__qa = t => {
  window.__setTime(t);
  const out = [];
  stage.querySelectorAll('.tx, .cap').forEach(e => {
    let op = 1, n = e;
    while (n && n !== document.body) { const cs = getComputedStyle(n); op *= parseFloat(cs.opacity); if (cs.display === 'none') { op = 0; break; } n = n.parentElement; }
    if (op < .35) return;
    const r = document.createRange(); r.selectNodeContents(e);
    const b = r.getBoundingClientRect();
    if (!b.width || !b.height) return;
    out.push({ text: (e.innerText || e.textContent).replace(/\s+/g, ' ').trim(), x0: b.left, y0: b.top, x1: b.right, y1: b.bottom,
      deco: !!e.closest('[data-deco]'), count: !!e.closest('[data-count]'), bleed: !!e.closest('[data-bleed]') });
  });
  return out;
};

if (new URLSearchParams(location.search).get('debug')) {
  const d = document.createElement('div'); d.className = 'dbg';
  d.style.cssText += `;left:${SAFE.x0}px;top:${SAFE.y0}px;width:${SAFE.x1 - SAFE.x0}px;height:${SAFE.y1 - SAFE.y0}px`; stage.appendChild(d);
}
window.__setTime(0);
})();
