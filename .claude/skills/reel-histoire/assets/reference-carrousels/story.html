<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Reel carrousels IA (histoire)</title>
<!--
  Reel Instagram 9:16 (1080x1920, 30 fps) — version « histoire » : on raconte POURQUOI des pages d'un site ne sont pas indexées par Google,
  comment on a trouvé les causes, puis ce qui a été corrigé et mesuré.
  Page PILOTÉE PAR LE TEMPS : window.__setTime(t) redessine l'état exact à l'instant t. Les instants viennent de timeline.js
  (calculé par plan.py à partir de la durée réelle de la voix). Aucune animation sur l'horloge réelle : rendu déterministe.
  window.EVENTS = événements sonores (type, instant) pour synth.cjs : une seule source de vérité pour l'image et le son.
  ?debug=1 affiche les zones sûres.
-->
<style>
:root{--ink:#0F1020;--muted:#6A6B80;--yellow:#FFD93B;--violet:#6C5CE7;--red:#E5383B;--green:#19A974;--night:#0B1433;
  --font:'Inter Display','Inter','Helvetica Neue',Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden;display:none}

.hl{background-image:linear-gradient(var(--yellow),var(--yellow));background-repeat:no-repeat;background-position:0 84%;
  background-size:calc(var(--p,0)*100%) .5em;padding:0 .08em;border-radius:.12em;color:var(--ink);-webkit-box-decoration-break:clone;box-decoration-break:clone}

.brand{display:flex;align-items:center;gap:9px;height:76px;padding:0 34px;background:#fff;border-radius:999px;font:900 36px/1 var(--font);letter-spacing:.02em;color:var(--ink);box-shadow:0 8px 26px rgba(20,20,60,.12)}

.counter.dark{background:rgba(255,255,255,.14);color:rgba(255,255,255,.8)}
.big{font:900 410px/1 var(--font);letter-spacing:-.045em;text-align:center;font-variant-numeric:tabular-nums}
.lab{font:900 92px/1.02 var(--font);letter-spacing:-.03em;text-align:center}
.h1{font:900 84px/1.04 var(--font);letter-spacing:-.035em;text-align:center}
.mono{font-family:var(--mono)}
/* légendes : mot dit en jaune, mots passés en encre, mots à venir en gris (instants de mots proportionnels, approximatifs) */

.cap .w.f{color:rgba(15,16,32,.28)} .cap .w.p{color:var(--ink)} .cap .w.c{background:var(--yellow);color:var(--ink)}
.card{background:#fff;border-radius:40px;box-shadow:0 24px 64px rgba(40,30,120,.15)}

.idx{background:#fff;border-radius:40px;border:3px solid #F3C6D4;box-shadow:0 24px 64px rgba(120,40,80,.16)}
.idxh{position:absolute;left:92px;top:34px;font:700 30px/1 var(--mono);letter-spacing:.08em;color:var(--muted)}

.idxline{position:absolute;left:44px;right:44px;height:12px;border-radius:6px;background:#F1E4EA}

/* S3 : rapport Search Console + terminal */

/* S5 : filtres */

.hbox{position:absolute;border:7px solid var(--yellow);background:rgba(255,217,59,.22);border-radius:14px}
.fchip{background:#fff;border-radius:22px;box-shadow:0 12px 34px rgba(120,70,40,.14);height:74px}

/* S6 : fichier qui change de nom */
.file{background:#fff;border-radius:28px;box-shadow:0 16px 44px rgba(60,40,140,.16);height:110px}
.file .ic{position:absolute;left:28px;top:27px;width:56px;height:56px}
.file .fn{position:absolute;left:104px;right:20px;top:0;bottom:0;display:flex;align-items:center;font:700 29px/1 var(--mono);white-space:nowrap}
.flab{font:700 26px/1 var(--mono);letter-spacing:.08em;color:var(--muted)}
/* S8 : corrections */
.step{background:#fff;border-radius:30px;box-shadow:0 14px 40px rgba(120,50,100,.14);height:96px}
.step .sl{position:absolute;left:130px;right:24px;top:0;bottom:0;display:flex;align-items:center;font:800 46px/1 var(--font);letter-spacing:-.02em}

.timer{background:var(--ink);color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:20px;font:900 62px/1 var(--font);letter-spacing:-.02em}
.timer svg{width:62px;height:62px}
/* S9 : avant / après */
.tag{font:900 64px/1 var(--font);letter-spacing:-.03em}
.mrow{background:#fff;border-radius:36px;box-shadow:0 20px 52px rgba(30,20,80,.14)}
.ml{position:absolute;left:40px;top:26px;right:130px;font:700 34px/1.12 var(--font);color:var(--muted)}
.mv{position:absolute;left:0;right:0;top:64px;text-align:center;font:900 150px/1 var(--font);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.mk{position:absolute;right:30px;top:26px;width:66px;height:66px;border-radius:50%;background:var(--green);padding:13px;opacity:0}
.cursor{background:#fff;box-shadow:0 0 0 2px rgba(20,20,60,.08),0 0 40px rgba(20,20,60,.25)}
.handle{border-radius:50%;background:#fff;box-shadow:0 10px 36px rgba(20,20,60,.35);display:flex;align-items:center;justify-content:center}
/* S10 : résultat */
.res{background:#fff;border-radius:36px;box-shadow:0 20px 56px rgba(20,100,90,.16)}
.res .ri{position:absolute;left:30px;top:50%;margin-top:-56px;width:112px;height:112px}
.res .r1{position:absolute;left:170px;right:24px;top:44px;font:700 28px/1 var(--mono);letter-spacing:.08em;color:var(--muted)}
.res .r2{position:absolute;left:170px;right:24px;top:92px;font:900 52px/1.05 var(--font);letter-spacing:-.025em}
.cal{background:#fff;border-radius:22px;border:4px solid var(--violet);overflow:hidden}
.cal .b{position:absolute;left:0;right:0;top:0;height:36px;background:var(--violet);color:#fff;text-align:center;font:800 20px/36px var(--font);letter-spacing:.08em}
.cal .d{position:absolute;left:0;right:0;top:36px;bottom:0;display:flex;align-items:center;justify-content:center;font:900 62px/1 var(--font)}
/* S11 : CTA */
.cta{background:#fff;border-radius:48px;box-shadow:0 30px 90px rgba(0,0,0,.4)}
.cta .ci{position:absolute;left:50%;margin-left:-60px;top:44px;width:120px;height:120px;border-radius:32px;background:#ECEAFD;padding:28px}
.cta .c1{position:absolute;left:0;right:0;top:196px;text-align:center;font:900 62px/1 var(--font);letter-spacing:-.03em}
.cta .c2{position:absolute;left:0;right:0;top:288px;text-align:center;font:900 78px/1.1 var(--font);letter-spacing:-.03em}
/* S0 titre + S0b problème */
.cdlogo{display:block;width:100%;height:100%;object-fit:contain}
.ttl{font:900 88px/1.06 var(--font);letter-spacing:-.035em;text-align:center}
.term2{background:#12132A;border-radius:30px;box-shadow:0 24px 64px rgba(10,10,40,.35);overflow:hidden}
.term2 .tb{position:absolute;left:0;right:0;top:0;height:60px;background:#1C1E3D;display:flex;align-items:center;gap:10px;padding-left:24px}
.term2 .tb i{width:15px;height:15px;border-radius:50%;background:#4A4D78;display:block}
.term2 .tt{position:absolute;left:0;right:0;top:0;height:60px;text-align:center;font:600 24px/60px var(--mono);color:rgba(255,255,255,.7)}
.term2 .cmd{position:absolute;left:30px;right:20px;top:96px;height:50px;white-space:nowrap;font:500 27px/50px var(--mono);color:#E8E9FF}
.term2 .cmd b{color:var(--yellow);font-weight:600;margin-right:14px}
.term2 .cur{display:inline-block;width:14px;height:30px;background:var(--yellow);vertical-align:-6px;margin-left:3px}
.okpill{background:var(--green);color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:16px;font:900 52px/1 var(--font);letter-spacing:-.02em}
.okpill i{display:block;width:52px;height:52px}
.rpill{background:var(--red);color:#fff;border-radius:999px;padding:0 26px;height:60px;font:800 34px/60px var(--font);display:inline-block;letter-spacing:-.01em}
.cause{background:#fff;border-radius:30px;box-shadow:0 14px 40px rgba(40,70,140,.16);height:112px}
.cause.good{border:6px solid var(--violet);box-shadow:0 18px 52px rgba(108,92,231,.30)}
.cause .cl{position:absolute;left:36px;top:0;bottom:0;display:flex;align-items:center;font:800 46px/1 var(--font);letter-spacing:-.025em}
.cause .st{background-image:linear-gradient(var(--red),var(--red));background-repeat:no-repeat;background-position:0 56%;background-size:calc(var(--s,0)*100%) 7px}
.cause .bd{position:absolute;right:26px;top:50%;margin-top:-34px;width:68px;height:68px;border-radius:50%;padding:15px;opacity:0}
.dbg{position:absolute;border:3px dashed rgba(255,0,120,.8);pointer-events:none;z-index:999}
</style>

<body>
<div id="stage"></div>
<script src="timeline.js"></script>
<script>
(() => {
'use strict';
const W = 1080, H = 1920;
const SAFE = { x0: 84, x1: 930, y0: 200, y1: 1540 };
const TL = window.TIMELINE, TOTAL = TL.total, NSC = TL.scenes.length;
const stage = document.getElementById('stage');
const EV = []; const ev = (type, t, o = {}) => EV.push(Object.assign({ type, t: Math.round(t * 1000) / 1000 }, o));

/* ---------- utilitaires ---------- */
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, d) => cl((t - a) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const eoExp = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eoBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const mk = (parent, cls, html) => { const e = document.createElement('div'); e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
const place = (e, x, y, w, h) => { e.style.left = x + 'px'; e.style.top = y + 'px'; if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px'; return e; };
const put = (e, o = {}) => { const { x = 0, y = 0, s = 1, r = 0, op = 1 } = o; e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; e.style.opacity = op; };
const enter = (e, t, a, o = {}) => { const { dx = 0, dy = 40, s0 = .94, d = .5, back = true } = o; const p = P(t, a, d), k = back ? eoBack(p) : eo(p); put(e, { x: dx * (1 - k), y: dy * (1 - k), s: s0 + (1 - s0) * k, op: cl(p * 2.2) }); return p; };
const capOp = (e, v) => { e.style.opacity = Math.min(parseFloat(e.style.opacity), v); };
const hlSet = (root, p) => root.querySelectorAll('.hl').forEach(h => h.style.setProperty('--p', p));
const txt = (parent, cls, html, x, y, w, h) => { const e = mk(parent, 'abs tx ' + cls, html); place(e, x, y, w, h); return e; };
const circle = (root, col) => { const c = mk(root, 'abs circle', null); c.dataset.bleed = ''; place(c, 500, -330, 900, 900); c.style.background = col || 'rgba(108,92,231,.10)'; return c; };
const drift = (c, t) => put(c, { x: Math.sin(t * .7) * 26, y: Math.cos(t * .55) * 22 });
const svgNS = 'http://www.w3.org/2000/svg';

const ICON = {
  check: (c = '#fff') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><path d="M11 25l9 9 17-19" fill="none" stroke="${c}" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:var(--d,0)"/></svg>`,
  cross: (c = '#fff') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><path d="M13 13l22 22M35 13L13 35" fill="none" stroke="${c}" stroke-width="6.5" stroke-linecap="round"/></svg>`,
  doc: (c = '#6C5CE7') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><path d="M12 5h17l9 9v29H12z" fill="none" stroke="${c}" stroke-width="3.6" stroke-linejoin="round"/><path d="M29 5v9h9M18 24h14M18 31h14M18 38h8" fill="none" stroke="${c}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  mag: (c = '#19A974') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><circle cx="21" cy="21" r="12" fill="none" stroke="${c}" stroke-width="4"/><path d="M30 30l13 13" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/></svg>`,
  clock: (c = '#FFD93B') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><circle cx="24" cy="24" r="19" fill="none" stroke="${c}" stroke-width="4"/><path d="M24 12v13l9 5" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  chev: () => `<svg viewBox="0 0 48 48" width="52" height="52"><path d="M18 12l-12 12 12 12M30 12l12 12-12 12" fill="none" stroke="#0F1020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  target: (c = '#6C5CE7') => `<svg viewBox="0 0 48 48" width="100%" height="100%"><circle cx="24" cy="24" r="19" fill="none" stroke="${c}" stroke-width="4"/><circle cx="24" cy="24" r="11" fill="none" stroke="${c}" stroke-width="4"/><circle cx="24" cy="24" r="3.5" fill="${c}"/></svg>`
};

/* ---------- chrome persistant ---------- */
const chrome = mk(stage, 'chrome', null); chrome.style.cssText = 'position:absolute;inset:0;z-index:100;pointer-events:none';
const brand = mk(chrome, 'abs brand', '<span data-deco>REFLEX</span><i class="dot"></i><span data-deco>IA</span>'); place(brand, 84, 206);
const counter = mk(chrome, 'abs counter', '1/' + NSC); counter.dataset.deco = ''; place(counter, SAFE.x1 - 150, 212, 150, 64);

/* ---------- légendes synchronisées sur la voix ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function caption(root, m) {
  const wrap = mk(root, 'abs', null); place(wrap, 88, 1170, 842, 380);
  const items = m.sent.map(s => { const el = mk(wrap, 'tx cap', s.words.map(w => `<span class="w f">${esc(w.w)}</span>`).join(' ')); el.style.display = 'none'; return { s, el, spans: [...el.querySelectorAll('.w')] }; });
  return t => {
    let act = -1; items.forEach((it, i) => { if (t >= it.s.start - .08) act = i; });
    items.forEach((it, i) => {
      const on = i === act; it.el.style.display = on ? 'block' : 'none'; if (!on) return;
      const e = P(t, it.s.start - .08, .25); it.el.style.opacity = e; it.el.style.transform = `translateY(${(1 - eo(e)) * 22}px)`;
      it.spans.forEach((sp, k) => { const w = it.s.words[k]; const c = t >= w.t1 ? 'p' : (t >= w.t0 ? 'c' : 'f'); if (sp.className !== 'w ' + c) sp.className = 'w ' + c; });
    });
  };
}

/* ---------- registre des scènes ---------- */
const SC = [];
const scene = (id, copy, fn) => {
  const m = TL.scenes.find(s => s.id === id);
  const root = mk(stage, 'scene', null); root.style.background = m.bg; root.style.zIndex = SC.length + 1;
  const upd = fn(root, m);
  const cap = m.caption ? caption(root, m) : null;
  SC.push({ id, m, root, upd, cap, copy: [...copy, ...(m.caption ? m.sent.map(s => s.cap) : [])] });
};
const pageCard = () => '<div class="pgbar"></div><div class="pgl" style="width:80%"></div><div class="pgl"></div><div class="pgl" style="width:60%"></div>';
const badge = (bg, icon) => `<div class="badge" style="background:${bg}">${icon}</div>`;
const popBadge = (e, p) => { const b = e.querySelector('.badge'); b.style.opacity = p > 0 ? 1 : 0; b.style.transform = `scale(${p > 0 ? eoBack(p) : 0})`; };

/* ===== SCÈNES du reel « Créer des carrousels automatiquement » ===== */
const card = (root, name, sub, y, h, hot, ic) => { const e = mk(root, 'abs', `<div class="tx" style="position:absolute;left:34px;top:${hot ? 24 : 22}px;font:900 ${hot ? 50 : 44}px/1 var(--font);letter-spacing:-.025em">${name}</div><div class="tx" style="position:absolute;left:34px;top:${hot ? 92 : 82}px;right:${ic ? 140 : 30}px;font:600 ${hot ? 33 : 30}px/1.18 var(--font);color:${hot ? 'var(--ink)' : 'var(--muted)'}">${sub}</div>`); e.style.cssText += `;background:#fff;border-radius:30px;box-shadow:0 16px 44px rgba(30,60,90,.14)${hot ? ';border:6px solid var(--violet)' : ''}`; place(e, 84, y, 846, h); if (ic) { const l = mk(e, '', ic); l.style.cssText += ';position:absolute;right:28px;top:26px;width:92px;height:92px'; l.dataset.deco = ''; } return e; };
const LOGO = '<img class="cdlogo" src="assets/claude.png" alt="">';

/* 1 — titre */
scene('titre', ['Créer des carrousels automatiquement', 'ta charte · ton point de vue · ta maquette', '0 € · texte seul', 'moins de 1 € · avec images'], (root, m) => {
  const [t1, t2] = m.sent;
  const c = circle(root, 'rgba(242,153,74,.14)');
  const lg = mk(root, 'abs', LOGO); place(lg, 450, 330, 180, 180); lg.dataset.deco = '';
  const ti = txt(root, 'ttl', 'Créer des carrousels <span class="hl">automatiquement</span>', 84, 560, 846, 300); ti.style.fontSize = '92px';
  const sub = txt(root, 'lab', 'ta charte · ton point de vue · ta maquette', 84, 900, 846, 110); sub.style.fontSize = '44px'; sub.style.color = 'var(--muted)';
  const p1 = mk(root, 'abs tx', '0 € · texte seul'); p1.style.cssText += ';background:#0F1020;color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;font:900 52px/1 var(--font);letter-spacing:-.02em'; place(p1, 130, 1080, 760, 104);
  const p2 = mk(root, 'abs tx', 'moins de 1 € · avec images'); p2.style.cssText += ';background:#6C5CE7;color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;font:900 52px/1 var(--font);letter-spacing:-.02em'; place(p2, 130, 1210, 760, 104);
  ev('thump', 0, { amp: .9 }); ev('pop', .1); ev('swipe', .8); ev('whoosh', t2.start - .05, { dur: .35 }); ev('pop', t2.start + .3); ev('pop', t2.start + 1.5); ev('ding', t2.start + 2.0, { f: 1046 });
  return t => {
    drift(c, t);
    const lp = P(t, .02, .6); put(lg, { s: eoBack(lp), r: -90 * (1 - eo(lp)) + t * 14, op: cl(lp * 3) });
    enter(ti, t, .15, { dy: 40, d: .55 }); hlSet(ti, P(t, .75, .5)); enter(sub, t, .9, { dy: 30, d: .5 });
    enter(p1, t, t2.start + .3, { dy: 50, d: .5 }); enter(p2, t, t2.start + 1.4, { dy: 50, d: .5 });
  };
});

/* 2 — les problèmes */
scene('probleme', ['À la main : des heures', 'Outils IA, Canva : rendu moyen', 'Sans méthode : 55 % de crédits perdus'], (root, m) => {
  const [p1, p2, p3] = m.sent;
  const c = circle(root, 'rgba(229,56,100,.08)');
  const mkBad = (label, y) => { const e = mk(root, 'abs cause', `<div class="cl"><span class="tx">${label}</span></div><div class="bd" style="background:var(--red)">${ICON.cross()}</div>`); place(e, 84, y, 846, 132); e.querySelector('.cl').style.fontSize = '42px'; return { e, bd: e.querySelector('.bd') }; };
  const R = [mkBad('À la main : des heures', 340), mkBad('Outils IA, Canva : rendu moyen', 520), mkBad('Sans méthode : 55 % de crédits perdus', 700)];
  R[2].e.querySelector('.cl').style.fontSize = '36px';
  const A = [p1.start + .15, p2.start + .15, p3.start + .15], X = [p1.start + 1.6, p2.start + 2.8, p3.start + 3.8];
  ev('whoosh', p1.start, { dur: .4 }); A.forEach(a => ev('swipe', a)); X.forEach(x => ev('thunk', x + .1, { amp: .85 }));
  return t => {
    drift(c, t);
    R.forEach((o, i) => { enter(o.e, t, A[i], { dy: 50, d: .5 }); const xp = P(t, X[i], .4); o.bd.style.opacity = xp > 0 ? 1 : 0; o.bd.style.transform = `scale(${xp > 0 ? eoBack(xp) : 0})`; o.e.style.transform += ` translateY(${Math.sin(t * 1.9 + i * 1.3) * 6}px)`; });
  };
});

/* 3 — le système : source -> angle, texte, images -> ton modèle */
scene('systeme', ['Ta source', 'URL de blog ou vidéo', "L'IA te donne", "l'angle · le texte · les images", 'Ton modèle', 'un carrousel que tu aimes', 'ta charte', 'ton point de vue'], (root, m) => {
  const [s1, s2, s3] = m.sent;
  const c = circle(root, 'rgba(25,169,116,.10)');
  const a = card(root, 'Ta source', 'URL de blog ou vidéo', 320, 150, false, ICON.doc('#6C5CE7'));
  const arw = mk(root, 'abs', '<svg width="80" height="70" viewBox="0 0 80 70"><path d="M40 4v46M18 32l22 24 22-24" fill="none" stroke="#6C5CE7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>'); place(arw, 500, 480, 80, 70);
  const b = card(root, "L'IA te donne", "l'angle · le texte · les images", 560, 190, true, LOGO);
  const d = card(root, 'Ton modèle', 'un carrousel que tu aimes', 790, 150, false, null);
  const chip = (txtv, x, col) => { const e = mk(root, 'abs tx', txtv); e.style.cssText += `;background:${col};border-radius:999px;display:flex;align-items:center;justify-content:center;font:800 34px/1 var(--font)`; place(e, x, 975, 400, 76); return e; };
  const c1 = chip('ta charte', 84, '#ECEAFD'), c2 = chip('ton point de vue', 530, '#FFF3CF');
  ev('whoosh', s1.start, { dur: .4 }); ev('pop', s1.start + .3); ev('swipe', s2.start + .1); ev('thump', s2.start + .4, { amp: .6 }); ev('pop', s3.start + .2); ev('pop', s3.start + 2.6); ev('pop', s3.start + 3.1); ev('ding', s3.start + 3.5, { f: 1046 });
  return t => {
    drift(c, t);
    enter(a, t, s1.start + .1, { dy: 50, d: .5 }); enter(arw, t, s2.start, { dy: 20, d: .4 }); enter(b, t, s2.start + .2, { dy: 60, d: .55 });
    if (t > s2.start + 1.2) b.style.transform = `scale(${1 + .015 * Math.sin((t - s2.start) * 3)})`;
    enter(d, t, s3.start + .1, { dy: 50, d: .5 }); enter(c1, t, s3.start + 2.5, { dy: 30, d: .4 }); enter(c2, t, s3.start + 3.0, { dy: 30, d: .4 });
  };
});

/* 6 — les exemples : vraies slides en défilement (Instagram, puis PDF LinkedIn) */
scene('exemples', ['Instagram', 'LinkedIn · PDF', '1 / 12'], (root, m) => {
  const [e1, e2] = m.sent;
  const c = circle(root, 'rgba(60,140,220,.12)');
  const frame = mk(root, 'abs', ''); frame.style.cssText += ';background:#fff;border-radius:34px;box-shadow:0 28px 72px rgba(30,40,100,.25);overflow:hidden'; place(frame, 170, 300, 740, 990);
  const hd = mk(frame, '', ''); hd.style.cssText += ';position:absolute;left:0;right:0;top:0;height:84px;background:#FFF';
  const lab = mk(hd, 'tx', 'Instagram'); lab.style.cssText += ';position:absolute;left:30px;top:0;bottom:0;display:flex;align-items:center;font:900 36px/1 var(--font);letter-spacing:-.02em';
  const cnt = mk(hd, 'tx', '1 / 12'); cnt.dataset.count = ''; cnt.style.cssText += ';position:absolute;right:30px;top:0;bottom:0;display:flex;align-items:center;font:600 28px/1 var(--mono);color:var(--muted)';
  const bar = mk(hd, '', ''); bar.style.cssText += ';position:absolute;left:0;right:0;bottom:0;height:5px;background:#E1306C';
  const view = mk(frame, '', ''); view.style.cssText += ';position:absolute;left:20px;top:94px;width:700px;height:875px;overflow:hidden;border-radius:16px;background:#eee'; view.dataset.deco = '';
  const strip = mk(view, '', ''); strip.style.cssText += ';position:absolute;left:0;top:0;height:875px;width:' + (12 * 700) + 'px;display:flex';
  for (let k = 1; k <= 12; k++) { const im = document.createElement('img'); im.src = 'assets/exemples/ex' + String(k).padStart(2, '0') + '.jpg'; im.style.cssText = 'display:block;width:700px;height:875px;flex:none'; strip.appendChild(im); }
  const T0 = e1.start + .5, END = m.end - .6, STEP = (END - T0) / 11.4;
  ev('whoosh', m.start, { dur: .4 }); for (let k = 0; k < 11; k++) ev('swipe', T0 + k * STEP + STEP * .25); ev('ding', e2.start + .2, { f: 1046 }); ev('pop', e2.start + .15);
  return t => {
    drift(c, t);
    enter(frame, t, m.start + .05, { dy: 70, d: .6 });
    const u = Math.max(0, (t - T0) / STEP), k = Math.min(11, Math.floor(u)), fr = u - k, sw = k >= 11 ? 0 : io(cl((fr - .35) / .55));
    strip.style.transform = `translateX(${-(k + sw) * 700}px)`;
    cnt.textContent = (Math.min(11, Math.round(k + sw)) + 1) + ' / 12';
    const li = t >= e2.start + .1;
    lab.textContent = li ? 'LinkedIn · PDF' : 'Instagram'; bar.style.background = li ? '#0A66C2' : '#E1306C';
    frame.style.transform += ` translateY(${Math.sin(t * 1.6) * 5}px)`;
  };
});

/* 7 — CTA sur bleu nuit, puis « Et ton carrousel ? » (la fin reboucle sur le titre) */
scene('cta', ['Abonne-toi', "pour plus d'astuces IA", 'sans compétences techniques', 'rapides', 'terriblement efficaces', 'Et ton carrousel ?'], (root, m) => {
  const [k1] = m.sent;
  const c = circle(root, 'rgba(255,255,255,.05)');
  const cta = mk(root, 'abs cta', `<div class="ci" style="padding:18px"><img class="cdlogo" src="assets/claude.png" alt=""></div><div class="tx c1" style="top:196px;font-size:78px"><span class="hl">Abonne-toi</span></div><div class="tx c2" style="top:300px;font-size:46px;line-height:1.1">pour plus d'astuces IA</div>`); place(cta, 84, 380, 846, 800);
  const chips = ['sans compétences techniques', 'rapides', 'terriblement efficaces'].map((s, i) => { const e = mk(cta, 'tx', s); e.style.cssText += `;position:absolute;left:60px;right:60px;top:${430 + i * 110}px;height:86px;border-radius:999px;background:${['#ECEAFD', '#E3F6EE', '#FFF3CF'][i]};display:flex;align-items:center;justify-content:center;font:800 40px/1 var(--font);letter-spacing:-.02em`; return e; });
  const big = txt(root, 'big', 'Et ton<br>carrousel ?', 84, 600, 846, 470); big.style.color = '#fff'; big.style.fontSize = '190px'; big.style.lineHeight = '1.02';
  const exitAt = m.end - 1.05, ct = [k1.start + .9, k1.start + 3.0, k1.start + 3.9];
  ev('whoosh', m.start, { dur: .4 }); ev('thump', m.start + .05, { amp: .45 }); ev('swipe', m.start + .6); ct.forEach(a => ev('pop', a)); ev('whoosh', exitAt, { dur: .35, down: true }); ev('thump', exitAt + .3, { amp: 1, big: true });
  return t => {
    drift(c, t);
    enter(cta, t, m.start, { dy: 80, d: .5 }); hlSet(cta, P(t, m.start + .5, .4));
    chips.forEach((e, i) => enter(e, t, ct[i], { dy: 30, d: .4 }));
    if (t > m.start + .6 && t <= exitAt) cta.style.transform = `translateY(${Math.sin((t - m.start - .6) * 3.4) * 7}px)`;
    if (t > exitAt) { const e = io(P(t, exitAt, .35)); cta.style.transform = `translateY(${-220 * e}px) scale(${1 - .1 * e})`; cta.style.opacity = 1 - e; }
    const q = P(t, exitAt + .2, .45); put(big, { s: .8 + .2 * eoBack(q), op: cl(q * 2) });
  };
});

/* ---------- pilotage temporel ---------- */
window.__setTime = t => {
  let idx = 0;
  SC.forEach((s, i) => {
    const last = i === SC.length - 1;
    const vis = t >= s.m.start && t < (last ? TOTAL + 1 : s.m.end + .25);
    s.root.style.display = vis ? 'block' : 'none';
    if (t >= s.m.start) idx = i;
    if (!vis) return;
    const e = i === 0 ? 1 : P(t, s.m.start, .2);
    s.root.style.opacity = e; s.root.style.transform = i === 0 ? 'none' : `translateY(${(1 - eo(e)) * 34}px)`;
    s.upd(t); if (s.cap) s.cap(t);
  });
  counter.textContent = (idx + 1) + '/' + NSC; counter.classList.toggle('dark', SC[idx].id === 'cta');
};
window.REEL = { total: TOTAL, safe: SAFE, scenes: SC.map(s => ({ id: s.id, start: s.m.start, end: s.m.end, copy: s.copy, caps: s.m.caption ? s.m.sent.map(x => x.cap) : [] })) };
window.EVENTS = EV;

/* contrôle qualité : texte visible et boîtes réelles (Range) à l'instant t */
window.__qa = t => {
  window.__setTime(t);
  const out = [];
  stage.querySelectorAll('.tx, .cap').forEach(e => {
    let op = 1, n = e;
    while (n && n !== document.body) { const cs = getComputedStyle(n); op *= parseFloat(cs.opacity); if (cs.display === 'none') { op = 0; break; } n = n.parentElement; }
    if (op < .35) return;
    const r = document.createRange(); r.selectNodeContents(e);
    const b = r.getBoundingClientRect();
    if (!b.width || !b.height) return;
    out.push({ text: (e.innerText || e.textContent).replace(/\s+/g, ' ').trim(), x0: b.left, y0: b.top, x1: b.right, y1: b.bottom,
      deco: !!e.closest('[data-deco]'), count: !!e.closest('[data-count]'), bleed: !!e.closest('[data-bleed]') });
  });
  return out;
};

if (new URLSearchParams(location.search).get('debug')) {
  const d = document.createElement('div'); d.className = 'dbg';
  d.style.cssText += `;left:${SAFE.x0}px;top:${SAFE.y0}px;width:${SAFE.x1 - SAFE.x0}px;height:${SAFE.y1 - SAFE.y0}px`; stage.appendChild(d);
}
window.__setTime(0);
})();
</script>
</body>
</html>
