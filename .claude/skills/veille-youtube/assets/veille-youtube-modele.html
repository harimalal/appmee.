ches JEV dans un vrai workflow n8n (tri de 500 avis clients ou d'emails fournisseurs d'un projet cosmétique) et tu mesures vitesse, coût et erreurs face à Claude. L'angle combine les trois mécanismes qui performent le mieux dans l'analyse : la vérification (vrai ou démo truquée ?), le croisement avec une niche que tu maîtrises, et une preuve chiffrée visible dès le titre. Les chiffres entre crochets sont à ajuster selon ton test réel.","titles":[{"t":"JEV : [500] décisions testées en vrai… démo truquée ou pas ?","w":"Doute + preuve chiffrée. Modèles : Shubham SHARMA (146 k vues), Meydeey (30 000 tests). Titre recommandé pour la portée."},{"t":"JEV trie [500] avis clients cosmétiques : mieux que Claude ?","w":"Croisement avec une niche + comparaison directe. Modèles : Impaaact (ratio 65), KΞVPUSH (ratio 8,3). Titre recommandé pour le ratio vues / abonnés."},{"t":"5 workflows n8n où JEV bat un LLM (et 2 où il échoue)","w":"Liste + nuance assumée. Modèles : Impaaact (5 usages), Meydeey (3 limites), Shubham (là où JEV se plante)."}],"thumb":"<p><b>Description.<\/b> Structure A. À gauche, un homme d'une quarantaine d'années, plan poitrine, un sourcil levé, une main qui pointe vers la droite. À droite, la tuile arrondie du logo JEV, en grand, légèrement inclinée, avec en dessous la petite tuile du logo Claude. En haut, <b>VRAI ?<\/b> en très gros (le point d'interrogation en jaune), et sous le logo <b>500 TESTS<\/b> avec la barre jaune.<\/p><p><b>Variante.<\/b> Sans visage : logo JEV à gauche, logo Claude à droite, séparés par un éclair jaune, avec <b>500 TESTS<\/b> en dessous.<\/p>","prompt":"YouTube thumbnail, 16:9, 1920x1080, premium minimalist look, readable in 2 seconds on a phone. SIGNATURE STYLE (identical on every thumbnail of the channel): deep blue-black background (#080C16) with a soft radial glow behind the main subject and fine film grain; ONE electric lemon-yellow accent (#FFE14A) used only for the key word, a thin 6 px underline bar under the text and a subtle rim light; bold extra-condensed uppercase sans-serif typography (Anton / Bebas Neue style), pure white with one word in yellow, thin dark outline and soft drop shadow, crisp and perfectly spelled; maximum three main elements and lots of empty dark space; a small empty rounded-square badge in the bottom-right corner reserved for the channel monogram. FACES: a single real-looking person, chest-up, direct gaze, hyper-realistic skin with visible pores and natural micro-expressions, soft key light plus a warm yellow rim light on the opposite side, about one third of the frame. BRAND LOGOS: reproduce the official logos of the named brands faithfully (exact shape and colors) as glossy rounded app-icon tiles with a soft shadow, never distorted.\n\nSTRUCTURE A (face + logo). Left third: chest-up portrait of a man in his 40s, skeptical expression with one eyebrow raised, one hand pointing toward the right of the frame. Right two thirds: a very large glossy rounded-square tile with the official JEV logo (hot pink and magenta rounded square with its interlocked geometric glyph), slightly tilted, and below it a small tile with the official Claude logo (orange asterisk mark). TEXT: top, huge 'VRAI ?' in white with the question mark in yellow; under the JEV tile, 'JEV : 500 TESTS' smaller, with '500' in yellow, a yellow underline bar beneath.","struct":"A","els":[{"o":1,"el":"Le croisement « + » entre deux outils, ici avec une seule idée par miniature (Impaaact, ratio 65)."},{"o":2,"el":"L'expression songeuse, sourcil levé, qui pose la question sans la dire."},{"o":3,"el":"Le doigt pointé vers le logo et le chiffre de preuve (70 à 500 ms)."},{"o":4,"el":"Le logo en grand sur une tuile arrondie, seul au centre du regard.","d":true}]},"why":{"defs":"Constats tirés des 30 vidéos longues relevées. L'échantillon est petit et une corrélation n'est pas une cause : ce sont des hypothèses solides, pas des lois.","cards":[{"h":"1. La fenêtre de lancement","html":"<p><b>Constat.<\/b> 9 des 10 vidéos les plus vues sont sorties entre le 18 et le 28 septembre, soit dans les 13 jours après l'annonce du 15 septembre. En octobre, les mises à jour et tutos tournent entre 0,03 et 0,16 de ratio.<\/p>\n<p><b>À reprendre.<\/b> Publier entre J+1 et J+14. Préparer le test avant l'annonce, car la rapidité compte autant que la qualité.<\/p>\n<p><b>Déclinaisons.<\/b><\/p>\n<ul><li>J+1 : réaction courte à l'annonce.<\/li><li>J+7 : test chiffré (la vidéo à viser).<\/li><li>J+30 : retour d'expérience, utile pour la traîne.<\/li><\/ul>"},{"h":"2. L'angle de vérification","html":"<p><b>Constat.<\/b> Shubham SHARMA (vrai ou démo truquée ?, 146 k vues), Erwan (Sans Hype, ratio 1,48), Okba (vraiment ?, ratio 2,3), Nerdy Kings (toute cette hype ?), Melvynx (mais ça n'a rien à voir). Le lanceur promettait 200x plus rapide et 400x moins cher : le public attend un verdict de confiance plus qu'une explication.<\/p>\n<p><b>À reprendre.<\/b> Citer la promesse chiffrée du lanceur dans le titre, puis poser le doute. Dans la vidéo : promesse, test, verdict nuancé avec les limites (chapitres Là où JEV se plante, Mon verdict).<\/p>\n<p><b>Déclinaisons.<\/b><\/p>\n<ul><li>[Outil] : [promesse]… vrai ou truqué ?<\/li><li>[Outil] expliqué et testé en [N] minutes (sans hype)<\/li><li>[Promesse], mais ça n'a rien à voir<\/li><\/ul>"},{"h":"3. Le croisement avec une niche","html":"<p><b>Constat.<\/b> Impaaact atteint 10 k vues avec 161 abonnés (Obsidian + Claude + JEV, 5 usages). KΞVPUSH fait 8 fois ses abonnés avec des cas d'usage par métier (SEO, urgence, modération, KYC). Contre-exemple : Dr. Firas (OpenClaw, n8n) reste entre 0,03 et 0,06 sur 41 k abonnés : citer un outil ne suffit pas, il faut un résultat concret.<\/p>\n<p><b>À reprendre.<\/b> Choisir une audience qui a déjà un outil central, montrer un résultat dans cet outil et nommer 2 ou 3 outils dans le titre.<\/p>\n<p><b>Déclinaisons.<\/b><\/p>\n<ul><li>Cosmétique : tri d'avis clients, d'emails fournisseurs, de demandes réglementaires.<\/li><li>Notion : classement automatique de pages.<\/li><li>n8n : un routeur de décisions à la place d'un nœud LLM.<\/li><\/ul>"},{"h":"4. La preuve chiffrée dans le titre","html":"<p><b>Constat.<\/b> 30 000 tests (Meydeey), 9 minutes (Erwan), 5 usages (Impaaact), 110x plus rapide en prod (Hexa), 12 démos (Polymorf). 10 des 15 titres du Top commencent par le nom du sujet, et la plupart tiennent entre 50 et 70 caractères.<\/p>\n<p><b>À reprendre.<\/b> Un chiffre de volume (tests, décisions), un chiffre de durée ou de liste, et le nom du sujet dans les 3 premiers mots.<\/p>\n<p><b>Déclinaisons.<\/b><\/p>\n<ul><li>[N] tests en conditions réelles<\/li><li>[N] usages concrets (et [M] qui échouent)<\/li><li>Résultat en [N] minutes<\/li><\/ul>"},{"h":"5. La miniature","html":"<p><b>Constat.<\/b> Trois familles sur les miniatures observées. Visage réactif + logo + 3 mots (Okba : VRAIMENT IMPRESSIONNANT ?, KΞVPUSH : UN LLM POUR ÇA ?, Eliott Meunier : 400X MOINS CHER). Thèse en texte (IA et Stratégie : La fin du tout-LLM a commencé). Minimaliste ou illustrée (Impaaact : + JEV, ratio 65 ; AI LABS : The Jev Era).<\/p>\n<p><b>À reprendre.<\/b> Un logo reconnaissable, un regard ou une émotion, 3 à 4 mots maximum, un accent de couleur repris du logo, fond sombre. Texte en question quand le titre pose un doute : titre et miniature disent la même chose.<\/p>\n<p><b>Déclinaisons.<\/b><\/p>\n<ul><li>Logo + question courte (VRAIMENT ?)<\/li><li>Formule croisement : [Outil A] + [Outil B] en gros<\/li><li>Chiffre choc : [N]X MOINS CHER<\/li><\/ul>"},{"h":"6. Durée et structure","html":"<p><b>Constat.<\/b> 8 des 15 vidéos du Top durent entre 9 et 16 minutes, avec des exceptions longues (27 à 41 minutes) quand le sujet est approfondi. Les plus grosses ont des chapitres détaillés : Shubham 12, KΞVPUSH 11, AI LABS 11.<\/p>\n<p><b>À reprendre.<\/b> Une ouverture qui annonce le test et le verdict, des chapitres par cas d'usage, une section sur les limites. Mentionner la durée dans le titre si elle est courte.<\/p>\n<p><b>Déclinaisons.<\/b><\/p>\n<ul><li>Format 10 minutes : promesse, 3 tests, verdict.<\/li><li>Format 25 minutes et plus : une série de cas d'usage avec chapitres.<\/li><\/ul>"}]},"pattern":{"formulas":["Titre : [NOM] + [promesse chiffrée du lanceur] + [doute]","Croisement : [NOM] x [outil de niche] + [N] cas testés","Miniature : [logo] + [regard] + [3 mots en question ou en chiffre] + [accent couleur du logo]","Vidéo : 9 à 15 minutes, publiée entre J+1 et J+14, preuve chiffrée, verdict nuancé, chapitres"],"checklist":["Le titre cite la promesse du lanceur avec son chiffre.","Un seul doute posé, et le verdict final est nuancé.","Au moins un test en volume visible à l'écran (centaines de cas).","Un outil de niche nommé dans le titre ou la miniature.","La miniature se lit en 2 secondes sur mobile."],"examples":["<b>Nouveau modèle annoncé avec une promesse chiffrée<\/b> : Modèle X : [promesse]… vrai ou truqué ? Test sur [N] cas.","<b>Nouvel outil no-code ou agent<\/b> : [Outil] + n8n : 5 workflows testés (et 2 qui plantent).","<b>Mise à jour majeure<\/b> : [Outil] v[N] : ce qui change vraiment (sans hype).","<b>Outil appliqué à ton métier<\/b> : [Outil] pour formuler en cosmétique : je teste sur [10] formules réelles."]},"rows":[{"i":"WlqokukfLrU","t":"Obsidian, Claude et Jev : 5 usages pour votre second cerveau","c":"Impaaact","d":"2026-10-25","v":10508,"s":161,"u":341,"r":"Outlier majeur : 161 abonnés, 10 k vues en 3 jours. Croisement JEV x Obsidian x Claude, audience de niche très qualifiée. Format court (6 min), titre en liste (5 usages).","a":3,"q":65.26708074534162,"m":106481.1,"k":"ok","n":true,"g":1,"o":1,"h":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA8KCw0LCQ8NDA0REA8RFiUYFhQUFi0gIhslNS84NzQvNDM7QlVIOz9QPzM0SmRLUFdaX2BfOUdob2dcblVdX1v/2wBDARARERYTFisYGCtbPTQ9W1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1v/wgARCABsAMADASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECBQYEA//EABgBAQEBAQEAAAAAAAAAAAAAAAAB       var li=document.createElement('li'),b=document.createElement('button');
      b.className='sbtn';b.type='button';b.setAttribute('data-id',r.id);b.setAttribute('aria-current',String(r.id===state.cur));
      b.innerHTML='<span class="q">'+esc(r.name)+'</span><span class="m"><i class="i'+bk(r.max)+'"></i>'+esc(fmtShort(r.date))+' · '+r.kpi.n+' vidéos · ratio max '+fmtR(r.max)+'</span>';
      b.onclick=function(){location.hash=r.id};
      li.appendChild(b);ul.appendChild(li);
    });
    $('#ovbtn').setAttribute('aria-current',String(state.cur==='apercu'));
    $('#ovn').textContent=D.length;
    var sel=$('#ft'),c=tags(),h='<option value="">Tous les tags</option>';
    Object.keys(c).sort().forEach(function(t){h+='<option value="'+esc(t)+'"'+(state.tag===t?' selected':'')+'>'+esc(t)+' ('+c[t]+')</option>'});
    if(sel.getAttribute('data-n')!==h){sel.innerHTML=h;sel.setAttribute('data-n',h)}
  }

  /* graphique : abonnés (x) et vues (y), échelles logarithmiques, couleur par tranche de ratio */
  function chart(rows){
    var pts0=rows.filter(function(v){return v.s>0&&v.v>0});
    var W=760,H=420,L=56,R=18,T=16,B=46;
    var sx=pts0.map(function(v){return v.s}),sy=pts0.map(function(v){return v.v});
    var xmin=Math.pow(10,Math.floor(Math.log10(Math.min.apply(null,sx))));
    var xmax=Math.pow(10,Math.ceil(Math.log10(Math.max.apply(null,sx)*1.05)));
    var ymin=Math.pow(10,Math.floor(Math.log10(Math.min.apply(null,sy))));
    var ymax=Math.pow(10,Math.ceil(Math.log10(Math.max.apply(null,sy)*1.05)));
    if(xmax/xmin<100){xmax=xmin*100}
    if(ymax/ymin<100){ymax=ymin*100}
    var lx=function(v){return L+(Math.log10(v)-Math.log10(xmin))/(Math.log10(xmax)-Math.log10(xmin))*(W-L-R)};
    var ly=function(v){return H-B-(Math.log10(v)-Math.log10(ymin))/(Math.log10(ymax)-Math.log10(ymin))*(H-T-B)};
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Nuage de points : abonnés en abscisse, vues en ordonnée, échelle logarithmique, points colorés par tranche de vues par abonné" style="min-width:600px">';
    for(var v=xmin;v<=xmax*1.001;v*=10){
      s+='<line x1="'+lx(v)+'" x2="'+lx(v)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--grid)"/><text x="'+lx(v)+'" y="'+(H-B+16)+'" text-anchor="middle">'+fmtK(v)+'</text>';
    }
    for(var w=ymin;w<=ymax*1.001;w*=10){
      s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ly(w)+'" y2="'+ly(w)+'" stroke="var(--grid)"/><text x="'+(L-8)+'" y="'+(ly(w)+4)+'" text-anchor="end">'+fmtK(w)+'</text>';
    }
    s+='<text x="'+((W+L-R)/2)+'" y="'+(H-8)+'" text-anchor="middle">Abonnés de la chaîne</text>';
    s+='<text transform="translate(12 '+((H-B+T)/2)+') rotate(-90)" text-anchor="middle">Vues</text>';
    [[3,1],[5,2],[10,3]].forEach(function(r){
      var x1=xmin,y1=xmin*r[0],x2=xmax,y2=xmax*r[0];
      if(y1<ymin){x1=ymin/r[0];y1=ymin}
      if(y2>ymax){x2=ymax/r[0];y2=ymax}
      if(x1>=x2)return;
      s+='<line class="rl b'+r[1]+'" x1="'+lx(x1)+'" y1="'+ly(y1)+'" x2="'+lx(x2)+'" y2="'+ly(y2)+'" stroke-dasharray="5 4" opacity=".75"/>';
      s+='<text class="rt b'+r[1]+'" x="'+(lx(x2)-5)+'" y="'+(ly(y2)+(y2>=ymax*0.999?14:-6))+'" text-anchor="end" style="font-weight:500">'+r[0]+' ×</text>';
    });
    var pts=pts0.map(function(v){return {v:v,x:lx(v.s),y:ly(v.v)}});
    for(var pass=0;pass<24;pass++){
      for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){
        var dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<20){var push=(20-d)/2+.5,ang=d===0?Math.PI/2:Math.atan2(dy,dx);
          pts[i].x+=Math.cos(ang)*push;pts[i].y+=Math.sin(ang)*push;pts[j].x-=Math.cos(ang)*push;pts[j].y-=Math.sin(ang)*push}
      }
    }
    pts.forEach(function(p){
      s+='<g data-id="'+p.v.i+'"><circle class="dot b'+p.v.b+'" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="9.5"></circle><text class="dotn" x="'+p.x.toFixed(1)+'" y="'+(p.y+3.5).toFixed(1)+'">'+p.v.o+'</text></g>';
    });
    return s+'</svg>';
  }
  function legend(rows){
    var c=[0,0,0,0];rows.forEach(function(v){c[v.b]++});
    return [3,2,1,0].map(function(k){return '<span><i class="i'+k+'"></i>'+BL[k]+' ('+c[k]+')</span>'}).join('')+'<span>Le numéro correspond au rang du classement. Les lignes en pointillés marquent 3, 5 et 10 vues par abonné.</span>';
  }

  /* cartes vidéo */
  function videoRow(v,r,opt){
    opt=opt||{};
    var rb=Math.min(100,Math.log10(1+v.q)/Math.log10(1+(opt.maxq||r.max))*100);
    var mb=Math.min(100,Math.sqrt(v.m/(opt.maxm||r.maxm))*100);
    var date=(r.approx?'vers le ':'')+fmtDate(v.d);
    return '<article class="v b'+v.b+'" id="v-'+esc(v.i)+'">'+
      '<div class="rk" title="'+esc(BL[v.b])+'">'+(opt.rank||v.o)+'</div>'+
      '<a class="th" href="https://www.youtube.com/watch?v='+v.i+'" target="_blank" rel="noopener"><img src="'+v.h+'" alt="Miniature : '+esc(v.t)+'" loading="lazy" width="320" height="180"></a>'+
      '<div class="vb">'+
        '<a class="vt" href="https://www.youtube.com/watch?v='+v.i+'" target="_blank" rel="noopener">'+esc(v.t)+'</a>'+
        '<div class="vm"><span>'+esc(v.c)+'</span><span class="chip c'+v.b+'">'+BS[v.b]+' ×</span>'+(v.n?'<span class="chip warn">récente, '+v.a+' j</span>':'')+'<span>'+esc(date)+'</span><span>'+fmtMin(v.u)+'</span></div>'+
        '<div class="stats">'+
          '<div class="stat"><div class="k">Abonnés</div><div class="n">'+fmtK(v.s)+'</div></div>'+
          '<div class="stat"><div class="k">Vues</div><div class="n">'+fmtInt(v.v)+'</div></div>'+
          '<div class="stat"><div class="k">Vues / abonné</div><div class="n rn">'+fmtR(v.q)+' ×</div><div class="bar br"><b style="width:'+rb.toFixed(0)+'%"></b></div></div>'+
          '<div class="stat"><div class="k">Vues / mois</div><div class="n">'+fmtInt(v.m)+'</div><div class="bar"><b style="width:'+mb.toFixed(0)+'%"></b></div></div>'+
        '</div>'+
        (v.r?'<p class="rem">'+esc(v.r)+'</p>':'')+
        (opt.src?'<div class="src">Recherche : <a href="#'+esc(r.id)+'">'+esc(r.name)+'</a></div>':'')+
      '</div></article>';
  }
  function segBtns(items,cur,attr){return items.map(function(x){return '<button type="button" '+attr+'="'+x[0]+'" aria-pressed="'+(String(x[0])===String(cur))+'">'+x[1]+'</button>'}).join('')}
  function trItems(rows){
    var c=[0,0,0,0];rows.forEach(function(v){c[v.b]++});
    return [[-1,'Toutes ('+rows.length+')'],[3,'10 × et plus ('+c[3]+')'],[2,'5 à 10 × ('+c[2]+')'],[1,'3 à 5 × ('+c[1]+')'],[0,'Moins de 3 × ('+c[0]+')']];
  }

  /* page d'une recherche */
  function renderReport(r){
    var main=$('#main'),rows=r.rows.slice();
    r.maxm=Math.max.apply(null,rows.map(function(v){return v.m}));
    var S=r.synth,W=r.why,P=r.pattern;
    var titles=S.titles.map(function(t,i){return '<li><div><span class="tt">'+esc(t.t)+'</span><span class="tw">'+esc(t.w)+'</span></div><button class="copy" type="button" data-t="'+i+'">Copier</button></li>'}).join('');
    var why=W.cards.map(function(c){return '<div><h4>'+esc(c.h)+'</h4>'+c.html+'</div>'}).join('');
    var pat='<div><h3>Formule</h3>'+P.formulas.map(function(f){return '<p class="f">'+esc(f)+'</p>'}).join('')+'</div>'+
            '<div><h3>Checklist</h3><ul>'+P.checklist.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'+
            '<div><h3>Exemples sur d\'autres sujets</h3><ul>'+P.examples.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>';
    var st=SIG&&S.struct?SIG.structures.filter(function(x){return x.k===S.struct})[0]:null;
    var stc=st?'<div class="stc"><span class="chip">Structure '+esc(st.k)+' · '+esc(st.n)+'</span><span class="d">'+esc(st.d)+'</span></div>':'';
    var els=S.els&&S.els.length?'<h3>Repris du top 5</h3><ul class="els">'+S.els.slice().sort(function(a,b){return a.o-b.o}).map(function(e){var v=rows.filter(function(x){return x.o===e.o})[0];return '<li><span class="mk b'+(v?v.b:0)+'">'+e.o+'</span><span>'+esc(e.el)+(e.d?' <em class="df">élément différenciant</em>':'')+'</span></li>'}).join('')+'</ul>':'';
    var best=rows.filter(function(v){return v.o===1})[0]||rows[0];
    main.innerHTML=
      '<header class="head"><div class="eyebrow">Recherche du '+esc(fmtDate(r.date))+(r.tags&&r.tags.length?' · '+esc(r.tags.join(', ')):'')+'</div><h1>'+esc(r.h1)+'</h1>'+
      '<p>'+rows.length+' vidéos longues classées de la plus performante à la moins performante, selon le ratio vues par abonné. Meilleur ratio : '+esc(best.c)+' ('+fmtR(best.q)+' ×). '+esc(r.method)+'</p></header>'+
      '<section><h2>Synthèse pour votre vidéo</h2><div class="synth">'+
        '<div class="panel angle"><h3>Angle de vidéo</h3><p>'+S.angle+'</p></div>'+
        '<div class="panel titlesp"><h3>Trois titres</h3><ul class="titles">'+titles+'</ul></div>'+
        '<div class="panel thumbp"><div><h3>Miniature signature</h3>'+stc+els+S.thumb+'</div><div><h3>Prompt pour générateur d\'image</h3><div class="code" id="pcode">'+esc(S.prompt)+'</div><button class="copy" type="button" id="cthumb">Copier le prompt</button>'+(SIG&&SIG.tip?'<p class="tipn">'+esc(SIG.tip)+'</p>':'')+'</div></div>'+
      '</div></section>'+
      '<section><h2>Pourquoi elles performent</h2><div class="panel"><p class="defs">'+W.defs+'</p><div class="why">'+why+'</div><div class="pattern">'+pat+'</div></div></section>'+
      '<section><h2>Abonnés et vues</h2><div class="panel"><div class="chartwrap" id="chart">'+chart(rows)+'</div><div class="legend">'+legend(rows)+'</div></div></section>'+
      '<section><div class="listhead"><h2>Classement des '+rows.length+' vidéos</h2><button class="copy" type="button" id="ctsv">Copier en tableau</button></div>'+
      '<div class="ctl"><div class="seg" id="segs"><span class="lab">Trier</span>'+segBtns([['rank','Classement'],['q','Vues / abonné'],['m','Vues / mois'],['v','Vues']],state.sort,'data-k')+'</div>'+
      '<div class="seg" id="segt"><span class="lab">Tranche</span>'+segBtns(trItems(rows),state.tr,'data-b')+'</div></div>'+
      '<div class="vlist" id="vlist"></div><p class="src" style="margin:16px 0 0">Source : YouTube, résultats de recherche ('+esc(r.src)+'). Seules les vidéos de plus de 4 minutes sont retenues (Shorts exclus). Le Top 15 est limité aux vidéos de plus de 500 vues et de plus de 2 jours. '+esc(r.note||'')+'</p></section>';
    function list(){
      var L=rows.filter(function(v){return state.tr<0||v.b===state.tr});
      var k=state.sort;
      if(k!=='rank')L.sort(function(a,b){return (b[k]||0)-(a[k]||0)});else L.sort(function(a,b){return a.o-b.o});
      var h='';
      if(k==='rank'&&state.tr<0){
        h+='<div class="grp">Top 15</div>'+L.filter(function(v){return v.g===1}).map(function(v){return videoRow(v,r)}).join('');
        var rest=L.filter(function(v){return v.g!==1});
        if(rest.length)h+='<div class="grp">Suite du classement</div>'+rest.map(function(v){return videoRow(v,r)}).join('');
      }else h=L.map(function(v){return videoRow(v,r)}).join('')||'<div class="err">Aucune vidéo dans cette tranche.</div>';
      $('#vlist').innerHTML=h;
    }
    list();
    $$('#segs button').forEach(function(b){b.onclick=function(){state.sort=b.getAttribute('data-k');$$('#segs button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});list()}});
    $$('#segt button').forEach(function(b){b.onclick=function(){state.tr=+b.getAttribute('data-b');$$('#segt button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});list()}});
    $$('.titles .copy').forEach(function(b){b.onclick=function(){copy(S.titles[+b.getAttribute('data-t')].t,b)}});
    $('#cthumb').onclick=function(){copy(S.prompt,$('#cthumb'))};
    $('#ctsv').onclick=function(){
      var t=['Rang\tTitre\tChaîne\tDate\tVues\tAbonnés\tVues par abonné\tVues par mois'].concat(rows.slice().sort(function(a,b){return a.o-b.o}).map(function(v){return [v.o,v.t,v.c,v.d,v.v,v.s,fmtR(v.q),Math.round(v.m)].join('\t')})).join('\n');
      copy(t,$('#ctsv'));
    };
    var tip=$('#tip');
    $$('#chart g').forEach(function(g){
      var v=rows.filter(function(x){return x.i===g.getAttribute('data-id')})[0];
      g.addEventListener('mousemove',function(e){tip.style.display='block';tip.textContent=v.o+'. '+v.c+' : '+fmtK(v.s)+' abonnés, '+fmtInt(v.v)+' vues ('+fmtR(v.q)+' ×)';tip.style.left=Math.min(window.innerWidth-300,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'});
      g.addEventListener('mouseleave',function(){tip.style.display='none'});
      g.addEventListener('click',function(){
        var el=document.getElementById('v-'+v.i);
        if(!el){state.tr=-1;state.sort='rank';renderReport(r);el=document.getElementById('v-'+v.i)}
        if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
      });
    });
  }

  function sigPanel(){
    if(!SIG)return '';
    return '<section><h2>Miniature signature</h2><div class="panel"><p class="defs">'+esc(SIG.variety)+'</p><div class="why">'+
      SIG.rules.map(function(x){return '<div><h4>'+esc(x.h)+'</h4><p>'+esc(x.t)+'</p></div>'}).join('')+'</div>'+
      '<div class="pattern one"><div><h3>Structures</h3><ul>'+SIG.structures.map(function(x){return '<li><b>'+esc(x.k)+' · '+esc(x.n)+'.</b> '+esc(x.d)+'</li>'}).join('')+'</ul></div></div>'+
      '<details class="sigb"><summary>Bloc signature du prompt, commun à toutes les miniatures</summary><div class="code" id="sigcode">'+esc(SIG.block)+'</div><button class="copy" type="button" id="csig">Copier le bloc</button></details></div></section>';
  }
  /* vue d'ensemble */
  function renderOverview(){
    var main=$('#main'),L=visible(),all=[];
    D.forEach(function(r){r.rows.forEach(function(v){if(v.q!=null&&v.k!=='nd'&&v.v>=1000&&(!state.tag||(r.tags||[]).indexOf(state.tag)>=0))all.push({v:v,r:r})})});
    all.sort(function(a,b){return b.v.q-a.v.q});
    var nv=D.reduce(function(a,r){return a+r.kpi.n},0),n3=D.reduce(function(a,r){return a+r.rows.filter(function(v){return v.q>=3}).length},0);
    var last=D.slice().sort(function(a,b){return b.date<a.date?-1:1})[0];
    var tb=L.map(function(r){var n3=r.rows.filter(function(v){return v.q>=3}).length;
      return '<tr><td><a href="#'+esc(r.id)+'">'+esc(r.name)+'</a><div class="src">'+(r.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+'</div></td><td class="num">'+esc(fmtShort(r.date))+'</td><td class="num">'+r.kpi.n+'</td><td class="num">'+n3+'</td><td>'+esc(r.kpi.br.c)+'</td><td class="num"><span class="pill b'+bk(r.max)+'">'+fmtR(r.max)+' ×</span></td></tr>'}).join('');
    function best(){
      var F=all.filter(function(o){return state.otr<0||o.v.b===state.otr});
      var shown=F.slice(0,state.more);
      var m=all.length?all[0].v.q:1;
      $('#bl').innerHTML=(shown.map(function(o,i){return videoRow(o.v,o.r,{rank:i+1,src:true,maxq:m,maxm:o.r.maxm})}).join('')||'<div class="err">Aucune vidéo dans cette tranche.</div>')+(F.length>shown.length?'<button class="more" type="button" id="more">Afficher 20 vidéos de plus ('+(F.length-shown.length)+' restantes)</button>':'');
      var mb=$('#more');if(mb)mb.onclick=function(){state.more+=20;best()};
    }
    main.innerHTML=
      '<header class="head"><div class="eyebrow">Toutes les recherches</div><h1>Vue d\'ensemble</h1><p>Les recherches enregistrées et leurs meilleures vidéos, classées par vues par abonné. Les vidéos de moins de 1 000 vues et les vidéos trop récentes sont écartées du classement général.</p></header>'+
      '<section><div class="panel kp"><div><div class="n">'+D.length+'</div><div class="k">recherches</div></div><div><div class="n">'+fmtInt(nv)+'</div><div class="k">vidéos analysées</div></div><div><div class="n">'+fmtInt(n3)+'</div><div class="k">vidéos à 3 vues par abonné ou plus</div></div><div><div class="n">'+esc(fmtShort(last.date))+'</div><div class="k">dernière recherche</div></div></div></section>'+
      sigPanel()+
      '<section><h2>Recherches ('+L.length+')</h2><div class="panel"><div class="twrap"><table><thead><tr><th>Recherche</th><th class="num">Date</th><th class="num">Vidéos</th><th class="num">≥ 3 ×</th><th>Meilleure chaîne</th><th class="num">Meilleur ratio</th></tr></thead><tbody>'+(tb||'<tr><td colspan="6" class="empty">Aucune recherche pour ce filtre.</td></tr>')+'</tbody></table></div></div></section>'+
      '<section><div class="listhead"><h2>Meilleures vidéos, toutes recherches</h2></div><div class="ctl"><div class="seg" id="segt"><span class="lab">Tranche</span>'+segBtns(trItems(all.map(function(o){return o.v})),state.otr,'data-b')+'</div></div><div class="vlist" id="bl"></div></section>';
    best();
    var cs=$('#csig');if(cs)cs.onclick=function(){copy(SIG.block,cs)};
    $$('#segt button').forEach(function(b){b.onclick=function(){state.otr=+b.getAttribute('data-b');state.more=20;$$('#segt button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});best()}});
  }

  function route(){
    var h=(location.hash||'').replace('#','');
    var latest=D.slice().sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:b.seq-a.seq})[0];
    var id=h==='apercu'?'apercu':(byId[h]?h:(latest&&latest.id));
    state.cur=id;state.tr=-1;state.sort='rank';
    renderSide();
    if(id==='apercu')renderOverview();else if(byId[id])renderReport(byId[id]);
    if(!window.__first){window.__first=1}else window.scrollTo({top:0});
  }
  $('#ovbtn').onclick=function(){location.hash='apercu'};
  $('#fq').oninput=function(){state.q=this.value;renderSide();if(state.cur==='apercu')renderOverview()};
  $('#ft').onchange=function(){state.tag=this.value;renderSide();if(state.cur==='apercu')renderOverview()};
  window.addEventListener('hashchange',route);
  route();
})();
</script>

</body></html>
