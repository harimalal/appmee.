<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cockpit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Connexion -->
<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <div class="login-mark">🧭</div>
    <h1>Cockpit</h1>
    <p>Entre ton jeton d'accès. Il reste mémorisé sur cet appareil.</p>
    <input id="tokenInput" type="password" autocomplete="current-password" placeholder="Jeton d'accès" required>
    <button type="submit" class="btn primary">Entrer</button>
    <p id="loginError" class="login-error" hidden></p>
  </form>
</section>

<!-- Application -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand">🧭 <span>Cockpit</span></div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Projets"></nav>
    <div class="top-actions">
      <span id="sync" class="sync" title="État de synchronisation"></span>
      <button id="logout" class="icon-btn" title="Se déconnecter" aria-label="Se déconnecter">⎋</button>
    </div>
  </header>

  <main id="view" class="view"></main>
</div>

<!-- Panneau de détail -->
<div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Détail"></aside>

<div id="toast" class="toast" hidden></div>

<script src="vendor/Sortable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
